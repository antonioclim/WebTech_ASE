name: Validate public teaching repository

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-public-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Verify deterministic weekly bundles
        run: python 00_TOOLS/publishing/build_week_bundle.py --verify-all
      - name: Validate public repository
        run: python 00_TOOLS/qa/validate_public_repo.py --strict
      - name: Build Pages site locally
        run: python 00_TOOLS/publishing/build_pages_site.py --output _site
      - name: Validate Pages payload
        run: python 00_TOOLS/qa/validate_pages_payload.py --site _site
