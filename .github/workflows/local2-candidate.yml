name: Prepare LOCAL2 candidate and optional static reading preview

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: 'Exact reviewed 40-character lowercase commit SHA selected for this run'
        type: string
        required: true
      publish_preview:
        description: 'Owner only: publish this candidate static reading profile to the repository Pages site'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the selected immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the exact reviewed source and owner for optional publication
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          PUBLISH_PREVIEW: ${{ inputs.publish_preview }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Supply the full reviewed lowercase commit SHA. Candidate build stopped.' >&2
            exit 2
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" || "$GITHUB_SHA" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo 'Selected source differs from the reviewed commit. Candidate build stopped.' >&2
            exit 2
          fi
          if [[ "$PUBLISH_PREVIEW" != "true" && "$PUBLISH_PREVIEW" != "false" ]]; then
            echo 'publish_preview must be a boolean. Candidate build stopped.' >&2
            exit 2
          fi
          if [[ "$PUBLISH_PREVIEW" == "true" ]]; then
            if [[ "$GITHUB_REPOSITORY" != "antonioclim/WebTech_ASE" || "$GITHUB_ACTOR" != "antonioclim" || "$GITHUB_TRIGGERING_ACTOR" != "antonioclim" ]]; then
              echo 'Only the repository owner may request or rerun Pages publication. Candidate build stopped.' >&2
              exit 2
            fi
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Install the existing pinned workflow parser
        run: python -m pip install --requirement 00_TOOLS/qa/requirements.txt
      - name: Validate the complete public source with the existing strict QA
        run: python 00_TOOLS/qa/validate_public_repo.py --strict --report "$RUNNER_TEMP/webtech-local2-repository-validation.json"
      - name: Build and validate both candidate profiles outside the checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: python 00_TOOLS/publishing/local2/build_repository_candidate.py --output "$RUNNER_TEMP/webtech-local2"
      - name: Require the complete download inventory
        run: |
          set -euo pipefail
          for candidateFile in \
            WEBTECH_ASE_LOCAL2_CLASSROOM.zip \
            WEBTECH_ASE_LOCAL2_CLASSROOM.zip.sha256 \
            WEBTECH_ASE_LOCAL2_STATIC.zip \
            WEBTECH_ASE_LOCAL2_STATIC.zip.sha256 \
            BUILD_RECEIPT.json \
            PAYLOAD_VALIDATION.json \
            CANDIDATE_RELEASE_NOTES.txt; do
            test -s "$RUNNER_TEMP/webtech-local2/downloads/$candidateFile"
          done
          test -f "$RUNNER_TEMP/webtech-local2/static/.nojekyll"
      - name: Upload candidate downloads and bounded build receipts
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: webtech-local2-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/webtech-local2/downloads/
          include-hidden-files: false
          retention-days: 14
      - name: Configure the optional Pages publication
        if: ${{ inputs.publish_preview && github.repository == 'antonioclim/WebTech_ASE' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Upload the exact optional Pages reading profile
        if: ${{ inputs.publish_preview && github.repository == 'antonioclim/WebTech_ASE' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: ${{ runner.temp }}/webtech-local2/static
          include-hidden-files: true

  deploy-preview:
    if: ${{ inputs.publish_preview && github.repository == 'antonioclim/WebTech_ASE' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the candidate static reading profile to the repository Pages site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages
