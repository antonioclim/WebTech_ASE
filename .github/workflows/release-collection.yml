name: Prepare a draft complete English collection release

on:
  workflow_dispatch:
    inputs:
      preview:
        description: 'Explicitly permit this candidate; the release stays draft and prerelease'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: webtech-complete-english-candidate-release
  cancel-in-progress: false

jobs:
  publish-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the chosen commit and all tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Install the pinned workflow parser
        run: python -m pip install --requirement 00_TOOLS/qa/requirements.txt
      - name: Verify the complete source and all thirty objects
        run: python 00_TOOLS/qa/validate_public_repo.py --strict
      - name: Verify all fourteen weekly containers
        run: python 00_TOOLS/publishing/build_week_bundle.py --verify-all --plan 90_RELEASES/FULL_COLLECTION_PLAN.json
      - name: Prepare and verify the complete filtered candidate
        id: plan
        env:
          PREVIEW: ${{ inputs.preview }}
        run: |
          set -euo pipefail
          if [[ "$PREVIEW" != "true" ]]; then
            echo 'Explicit candidate preview is required. No final-release mode exists.' >&2
            exit 2
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo 'Checked-out commit differs from the workflow commit. Publication stopped.' >&2
            exit 2
          fi
          python 00_TOOLS/publishing/resolve_collection_release.py --plan 90_RELEASES/COLLECTION_RELEASE_PLAN.json --asset-dir "$RUNNER_TEMP/collection-release" --allow-preview --build --workflow-output --github-output "$GITHUB_OUTPUT"
      - name: Refuse existing tags and releases, including lookup errors
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          remote_tags="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          if [[ -n "$remote_tags" ]]; then
            echo "Tag $TAG already exists. Use a reviewed successor version." >&2
            exit 2
          fi
          response="$RUNNER_TEMP/collection-release-lookup.headers"
          errors="$RUNNER_TEMP/collection-release-lookup.errors"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --include >"$response" 2>"$errors"; then
            echo "Release $TAG already exists. Use a reviewed successor version." >&2
            exit 2
          fi
          if ! head -n 1 "$response" | grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)'; then
            cat "$errors" >&2
            echo 'Could not establish that the release is absent. Publication stopped.' >&2
            exit 2
          fi
      - name: Create the new tag atomically and the draft candidate release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.title }}
          NOTES: ${{ steps.plan.outputs.notes }}
          ARCHIVE: ${{ steps.plan.outputs.archive }}
          SIDECAR: ${{ steps.plan.outputs.sidecar }}
          CHECKSUMS: ${{ steps.plan.outputs.checksums }}
          DRAFT: ${{ steps.plan.outputs.draft }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$DRAFT" != "true" || "$PRERELEASE" != "true" ]]; then
            echo 'Candidate flags differ; publication stopped.' >&2
            exit 2
          fi
          # The API refuses an existing tag, including a tag created after the
          # preceding checks. A later failure deliberately leaves that tag;
          # this workflow never deletes, retargets or overwrites it on a rerun.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
          gh release create "$TAG" "$ARCHIVE" "$SIDECAR" "$CHECKSUMS" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES" --verify-tag --draft --prerelease
