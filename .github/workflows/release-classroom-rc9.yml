name: Prepare a draft remediated classroom RC9 prerelease

on:
  workflow_dispatch:
    inputs:
      preview:
        description: 'Explicitly prepare RC9 as a draft prerelease; this is not final acceptance'
        type: boolean
        required: true
        default: false
      expected_source_sha:
        description: 'Exact reviewed 40-character lowercase commit SHA selected for this run'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: webtech-remediated-classroom-rc9-candidate-release
  cancel-in-progress: false

jobs:
  prepare-classroom:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the selected source and all tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the exact reviewed source and explicit preview
        env:
          PREVIEW: ${{ inputs.preview }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          if [[ "$PREVIEW" != "true" ]]; then
            echo 'Explicit preview is required. No final-release mode exists.' >&2
            exit 2
          fi
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Supply the full reviewed lowercase commit SHA. Preparation stopped.' >&2
            exit 2
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" || "$GITHUB_SHA" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo 'Selected workflow source differs from the reviewed commit. Preparation stopped.' >&2
            exit 2
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up exact reference Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Install the pinned workflow parser
        run: python -m pip install --requirement 00_TOOLS/qa/requirements.txt
      - name: Validate source preservation, metadata and manual workflows
        run: python 00_TOOLS/qa/validate_public_repo.py --strict
      - name: Verify retained historical weekly containers
        run: python 00_TOOLS/publishing/build_week_bundle.py --verify-all --plan 90_RELEASES/FULL_COLLECTION_PLAN.json
      - name: Run the RC9 regressions and refusal cases
        run: python 00_TOOLS/qa/test_classroom_rc9.py
      - name: Check RC9 form logic with synthetic bounded records
        run: python -m unittest discover -s 00_TOOLS/qa -p test_rc9_forms.py
      - name: Check the protected S02 browser companion derivation
        run: python -m unittest discover -s 00_TOOLS/qa -p test_rc9_s02_browser.py
      - name: Check RC9 code derivations and path regressions
        run: python 00_TOOLS/qa/test_rc9_code.py
      - name: Build and independently verify the RC9 assets outside the checkout
        id: plan
        run: |
          set -euo pipefail
          python 00_TOOLS/publishing/resolve_classroom_rc9.py --plan 90_RELEASES/CLASSROOM_RC9_RELEASE_PLAN.json --asset-dir "$RUNNER_TEMP/classroom-rc9-release" --allow-preview --build --workflow-output --github-output "$GITHUB_OUTPUT"
      - name: Refuse existing tags and releases and fail closed on lookup errors
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$TAG" != 'classroom-en-gb-v3.0.0-rc.9' ]]; then
            echo 'Resolved tag differs from RC9. Preparation stopped.' >&2
            exit 2
          fi
          remote_tags="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          if [[ -n "$remote_tags" ]]; then
            echo "Tag $TAG already exists. Use a reviewed successor version." >&2
            exit 2
          fi
          response="$RUNNER_TEMP/classroom-rc9-release-lookup.headers"
          errors="$RUNNER_TEMP/classroom-rc9-release-lookup.errors"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --include >"$response" 2>"$errors"; then
            echo "Release $TAG already exists. Use a reviewed successor version." >&2
            exit 2
          fi
          if ! head -n 1 "$response" | grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)'; then
            cat "$errors" >&2
            echo 'Could not establish that the release is absent. Preparation stopped.' >&2
            exit 2
          fi
      - name: Create only a new tag and a draft RC9 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.title }}
          NOTES: ${{ steps.plan.outputs.notes }}
          ARCHIVE: ${{ steps.plan.outputs.archive }}
          SIDECAR: ${{ steps.plan.outputs.sidecar }}
          CHECKSUMS: ${{ steps.plan.outputs.checksums }}
          DRAFT: ${{ steps.plan.outputs.draft }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$DRAFT" != "true" || "$PRERELEASE" != "true" || "$TAG" != 'classroom-en-gb-v3.0.0-rc.9' ]]; then
            echo 'Candidate identity or flags differ. Preparation stopped.' >&2
            exit 2
          fi
          # Creation refuses an existing ref, including a concurrent creation.
          # A later failure can leave the new tag or a partial draft. Do not
          # delete, retarget or overwrite it automatically on a retry.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >"$RUNNER_TEMP/classroom-rc9-created-ref.json"
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          remote_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type')"
          if [[ "$remote_type" != 'commit' || "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo 'New remote tag does not point to the reviewed commit. Preparation stopped.' >&2
            exit 2
          fi
          gh release create "$TAG" "$ARCHIVE" "$SIDECAR" "$CHECKSUMS" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES" --verify-tag --draft --prerelease
