name: Prepare LOCAL3 corrections candidate

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: 'Exact reviewed full lowercase commit SHA selected for this run'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: webtech-local3-candidate
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the selected immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the reviewed source and repository owner
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ || "$(git rev-parse HEAD)" != "$GITHUB_SHA" || "$GITHUB_SHA" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo 'Selected source differs from the reviewed full commit SHA.' >&2
            exit 2
          fi
          if [[ "$GITHUB_REPOSITORY" != 'antonioclim/WebTech_ASE' || "$GITHUB_ACTOR" != 'antonioclim' || "$GITHUB_TRIGGERING_ACTOR" != 'antonioclim' ]]; then
            echo 'Only the repository owner may request or rerun this preparation.' >&2
            exit 2
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Set up the exact reference runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - name: Install the existing pinned workflow parser
        run: python -m pip install --requirement 00_TOOLS/qa/requirements.txt
      - name: Validate the complete public source with the existing strict QA
        run: python 00_TOOLS/qa/validate_public_repo.py --strict --report "$RUNNER_TEMP/webtech-local3-repository-validation.json"
      - name: Build and admit the exact reviewed LOCAL3 profiles outside the checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: python 00_TOOLS/publishing/local3/build_repository_candidate.py --output "$RUNNER_TEMP/webtech-local3"
      - name: Require the complete candidate download inventory
        run: |
          set -euo pipefail
          for candidateFile in WEBTECH_ASE_LOCAL3_CLASSROOM.zip WEBTECH_ASE_LOCAL3_CLASSROOM.zip.sha256 WEBTECH_ASE_LOCAL3_STATIC.zip WEBTECH_ASE_LOCAL3_STATIC.zip.sha256 BUILD_RECEIPT.json PAYLOAD_VALIDATION.json ARCHIVE_SHA256SUMS.txt CANDIDATE_RELEASE_NOTES.txt; do
            test -s "$RUNNER_TEMP/webtech-local3/downloads/$candidateFile"
          done
      - name: Upload candidate archives and bounded receipts
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: webtech-local3-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/webtech-local3/downloads/
          include-hidden-files: false
          retention-days: 14
