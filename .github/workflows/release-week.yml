name: Prepare a draft historical RC6 weekly prerelease

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Week number from the current FULL_COLLECTION_PLAN.json'
        type: choice
        required: true
        options: ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12', '13', '14']
      preview:
        description: 'Explicitly prepare historical RC6 assets as a draft prerelease'
        type: boolean
        required: true
        default: false
      expected_source_sha:
        description: 'Exact reviewed 40-character lowercase Git commit SHA selected for this run'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: webtech-historical-week-${{ inputs.week }}-candidate-release
  cancel-in-progress: false

jobs:
  publish-week:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the exact reviewed source and explicit preview
        env:
          PREVIEW: ${{ inputs.preview }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          if [[ "$PREVIEW" != "true" ]]; then
            echo 'Explicit preview is required. No final-release mode exists.' >&2
            exit 2
          fi
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Supply the full reviewed lowercase commit SHA. Preparation stopped.' >&2
            exit 2
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" || "$GITHUB_SHA" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo 'Selected workflow source differs from the reviewed commit. Preparation stopped.' >&2
            exit 2
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Install the pinned workflow parser
        run: python -m pip install --requirement 00_TOOLS/qa/requirements.txt
      - name: Verify deterministic weekly bundles
        run: python 00_TOOLS/publishing/build_week_bundle.py --verify-all --plan 90_RELEASES/FULL_COLLECTION_PLAN.json
      - name: Validate repository
        run: python 00_TOOLS/qa/validate_public_repo.py --strict
      - name: Resolve and verify release plan
        id: plan
        env:
          WEEK: ${{ inputs.week }}
        run: |
          set -euo pipefail
          python 00_TOOLS/publishing/resolve_release.py --plan 90_RELEASES/FULL_COLLECTION_PLAN.json --week "$WEEK" --language EN_GB --workflow-output --github-output "$GITHUB_OUTPUT" --allow-preview
      - name: Copy exactly the verified historical assets outside the checkout
        env:
          ASSETS: ${{ steps.plan.outputs.assets }}
          WEEK: ${{ inputs.week }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/historical-week-$WEEK-release"
          mkdir "$asset_dir"
          read -r -a asset_array <<< "$ASSETS"
          if [[ "${#asset_array[@]}" != '2' ]]; then
            echo 'Expected exactly two verified weekly assets. Preparation stopped.' >&2
            exit 2
          fi
          for source in "${asset_array[@]}"; do
            cp -- "$source" "$asset_dir/$(basename -- "$source")"
          done
      - name: Refuse existing tags and releases and fail closed on lookup errors
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          remote_tags="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          if [[ -n "$remote_tags" ]]; then
            echo "Tag $TAG already exists. Use a reviewed successor version." >&2
            exit 2
          fi
          response="$RUNNER_TEMP/weekly-release-lookup.headers"
          errors="$RUNNER_TEMP/weekly-release-lookup.errors"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --include >"$response" 2>"$errors"; then
            echo "Release $TAG already exists. Use a reviewed successor version." >&2
            exit 2
          fi
          if ! head -n 1 "$response" | grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)'; then
            cat "$errors" >&2
            echo 'Could not establish that the release is absent. Preparation stopped.' >&2
            exit 2
          fi
      - name: Create only a new tag and a draft historical weekly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.title }}
          NOTES: ${{ steps.plan.outputs.notes }}
          ASSETS: ${{ steps.plan.outputs.assets }}
          DRAFT: ${{ steps.plan.outputs.draft }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
          WEEK: ${{ inputs.week }}
        run: |
          set -euo pipefail
          if [[ "$DRAFT" != "true" || "$PRERELEASE" != "true" ]]; then
            echo 'Candidate flags differ. Preparation stopped.' >&2
            exit 2
          fi
          read -r -a asset_array <<< "$ASSETS"
          asset_dir="$RUNNER_TEMP/historical-week-$WEEK-release"
          archive="$asset_dir/$(basename -- "${asset_array[0]}")"
          sidecar="$asset_dir/$(basename -- "${asset_array[1]}")"
          # Ref creation refuses an existing tag, including concurrent creation.
          # A later failure can leave a tag or partial draft; do not overwrite it.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >"$RUNNER_TEMP/weekly-created-ref.json"
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          remote_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type')"
          if [[ "$remote_type" != 'commit' || "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo 'New remote tag does not point to the reviewed commit. Preparation stopped.' >&2
            exit 2
          fi
          gh release create "$TAG" "$archive" "$sidecar" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES" --verify-tag --draft --prerelease
