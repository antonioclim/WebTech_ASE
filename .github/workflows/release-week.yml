name: Publish a weekly GitHub Release

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Week number from RELEASE_PLAN.json'
        type: choice
        required: true
        options: ['01', '02']
      preview:
        description: 'Allow declared candidate assets, retaining plan draft/prerelease status and pending gates'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  publish-week:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Verify deterministic weekly bundles
        run: python 00_TOOLS/publishing/build_week_bundle.py --verify-all --weeks '${{ inputs.week }}' --language EN_GB
      - name: Validate repository
        run: python 00_TOOLS/qa/validate_public_repo.py --strict --weeks '${{ inputs.week }}' --language EN_GB
      - name: Resolve and verify release plan
        id: plan
        env:
          WEEK: ${{ inputs.week }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          preview_args=()
          if [[ "$PREVIEW" == "true" ]]; then
            preview_args+=(--allow-preview)
          fi
          python 00_TOOLS/publishing/resolve_release.py --week "$WEEK" --language EN_GB --github-output "$GITHUB_OUTPUT" "${preview_args[@]}"
      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Publish a new patch version instead." >&2
            exit 2
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Publish a new patch version instead." >&2
            exit 2
          fi
      - name: Publish immutable weekly release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.title }}
          NOTES: ${{ steps.plan.outputs.notes }}
          ASSETS: ${{ steps.plan.outputs.assets }}
          DRAFT: ${{ steps.plan.outputs.draft }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          read -r -a asset_array <<< "$ASSETS"
          release_args=()
          if [[ "$DRAFT" == "true" ]]; then
            release_args+=(--draft)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$TAG" "${asset_array[@]}" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES" --verify-tag=false "${release_args[@]}"
