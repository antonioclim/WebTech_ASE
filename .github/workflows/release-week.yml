name: Publish a weekly GitHub Release

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Week number from RELEASE_PLAN.json'
        type: choice
        required: true
        options: ['01', '02']

permissions:
  contents: write

jobs:
  publish-week:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Verify deterministic weekly bundles
        run: python 00_TOOLS/publishing/build_week_bundle.py --verify-all
      - name: Validate repository
        run: python 00_TOOLS/qa/validate_public_repo.py --strict
      - name: Resolve and verify release plan
        id: plan
        run: >-
          python 00_TOOLS/publishing/resolve_release.py
          --week '${{ inputs.week }}'
          --github-output "$GITHUB_OUTPUT"
      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Publish a new patch version instead." >&2
            exit 2
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Publish a new patch version instead." >&2
            exit 2
          fi
      - name: Publish immutable weekly release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.title }}
          NOTES: ${{ steps.plan.outputs.notes }}
          ASSETS: ${{ steps.plan.outputs.assets }}
        run: |
          read -r -a asset_array <<< "$ASSETS"
          gh release create "$TAG" "${asset_array[@]}" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES" --verify-tag=false
