name: Technical problem
description: Report a reproducible problem with a public student kit
title: "[Problem] "
labels: ["technical"]
body:
  - type: input
    id: object
    attributes:
      label: Object and version
      placeholder: S01 v6.0.1, C02 v1.2.1, environment v2.2
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the exact command and smallest relevant output. Remove credentials and private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, tokens, cookies and student data.
          required: true
