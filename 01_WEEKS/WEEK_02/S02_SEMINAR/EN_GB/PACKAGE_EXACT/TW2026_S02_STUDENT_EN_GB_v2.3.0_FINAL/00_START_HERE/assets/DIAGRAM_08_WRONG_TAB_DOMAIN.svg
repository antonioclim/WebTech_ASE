    <text x="60" y="88" font-family="Arial,sans-serif" font-size="21" fill="#dbe7ff">Do not collect evidence from an unrelated tab</text><rect x="60.0" y="132" width="618.0" height="334" rx="16" fill="white" stroke="#b8c6dc" stroke-width="2"/><text x="84.0" y="174" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#13233f">Wrong</text><circle cx="95.0" cy="209" r="20" fill="#175cd3"/><text x="95.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="128.0" y="205" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Address bar shows chatgpt.com,</text><text x="128.0" y="227" font-family="Arial,sans-serif" font-size="18" fill="#24344f">gemini.google.com or another site</text><circle cx="95.0" cy="287" r="20" fill="#175cd3"/><text x="95.0" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="128.0" y="283" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Network rows belong to the</text><text x="128.0" y="305" font-family="Arial,sans-serif" font-size="18" fill="#24344f">external service</text><circle cx="95.0" cy="365" r="20" fill="#175cd3"/><text x="95.0" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="128.0" y="361" font-family="Arial,sans-serif" font-size="18" fill="#24344f">STOP and close private tabs</text><rect x="700.0" y="132" width="618.0" height="334" rx="16" fill="white" stroke="#b8c6dc" stroke-width="2"/><text x="724.0" y="174" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#13233f">Correct</text><circle cx="735.0" cy="209" r="20" fill="#175cd3"/><text x="735.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="768.0" y="205" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Address bar begins</text><text x="768.0" y="227" font-family="Arial,sans-serif" font-size="18" fill="#24344f">http://127.0.0.1:</text><circle cx="735.0" cy="287" r="20" fill="#175cd3"/><text x="735.0" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="768.0" y="283" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Page title is Web lab tools</text><circle cx="735.0" cy="365" r="20" fill="#175cd3"/><text x="735.0" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="768.0" y="361" font-family="Arial,sans-serif" font-size="18" fill="#24344f">DevTools is attached to the local</text><text x="768.0" y="383" font-family="Arial,sans-serif" font-size="18" fill="#24344f">page</text><circle cx="735.0" cy="443" r="20" fill="#175cd3"/><text x="735.0" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="768.0" y="439" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Only synthetic teaching data is</text><text x="768.0" y="461" font-family="Arial,sans-serif" font-size="18" fill="#24344f">visible</text><text x="60" y="550" font-family="Arial,sans-serif" font-size="18" fill="#5a6880">Illustrative interface diagram - labels may vary by version</text></svg>