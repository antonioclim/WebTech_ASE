    <text x="60" y="88" font-family="Arial,sans-serif" font-size="21" fill="#dbe7ff">Use source, computed values and observation together</text><rect x="60.0" y="132" width="618.0" height="334" rx="16" fill="white" stroke="#b8c6dc" stroke-width="2"/><text x="84.0" y="174" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#13233f">Select the grid</text><circle cx="95.0" cy="209" r="20" fill="#175cd3"/><text x="95.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="128.0" y="205" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Open Elements or Inspector</text><circle cx="95.0" cy="287" r="20" fill="#175cd3"/><text x="95.0" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="128.0" y="283" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Select ul.card-grid</text><circle cx="95.0" cy="365" r="20" fill="#175cd3"/><text x="95.0" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="128.0" y="361" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Open Computed styles</text><circle cx="95.0" cy="443" r="20" fill="#175cd3"/><text x="95.0" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="128.0" y="439" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Find grid-template-columns</text><rect x="700.0" y="132" width="618.0" height="334" rx="16" fill="white" stroke="#b8c6dc" stroke-width="2"/><text x="724.0" y="174" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#13233f">Interpret carefully</text><circle cx="735.0" cy="209" r="20" fill="#175cd3"/><text x="735.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="768.0" y="205" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Count the resolved tracks</text><circle cx="735.0" cy="287" r="20" fill="#175cd3"/><text x="735.0" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="768.0" y="283" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Compare with the named viewport</text><circle cx="735.0" cy="365" r="20" fill="#175cd3"/><text x="735.0" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="768.0" y="361" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Do not infer all browsers from one</text><text x="768.0" y="383" font-family="Arial,sans-serif" font-size="18" fill="#24344f">run</text><circle cx="735.0" cy="443" r="20" fill="#175cd3"/><text x="735.0" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="768.0" y="439" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Record the evidence limit</text><text x="60" y="550" font-family="Arial,sans-serif" font-size="18" fill="#5a6880">Illustrative interface diagram - labels may vary by version</text></svg>