<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="592" viewBox="0 0 1400 592">
    <rect width="100%" height="100%" fill="#f5f7fb"/>
    <rect x="0" y="0" width="100%" height="118" fill="#13233f"/>
    <text x="60" y="52" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="white">Open the integrated terminal</text>
    <text x="60" y="88" font-family="Arial,sans-serif" font-size="21" fill="#dbe7ff">Use the terminal in the extracted package root</text><rect x="60.0" y="132" width="618.0" height="334" rx="16" fill="white" stroke="#b8c6dc" stroke-width="2"/><text x="84.0" y="174" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#13233f">Mouse route</text><circle cx="95.0" cy="209" r="20" fill="#175cd3"/><text x="95.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="128.0" y="205" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Open the Terminal menu</text><circle cx="95.0" cy="287" r="20" fill="#175cd3"/><text x="95.0" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="128.0" y="283" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Choose New Terminal</text><circle cx="95.0" cy="365" r="20" fill="#175cd3"/><text x="95.0" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="128.0" y="361" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Look at the path before the cursor</text><circle cx="95.0" cy="443" r="20" fill="#175cd3"/><text x="95.0" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="128.0" y="439" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Do not type until the path is</text><text x="128.0" y="461" font-family="Arial,sans-serif" font-size="18" fill="#24344f">correct</text><rect x="700.0" y="132" width="618.0" height="334" rx="16" fill="white" stroke="#b8c6dc" stroke-width="2"/><text x="724.0" y="174" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#13233f">Expected evidence</text><circle cx="735.0" cy="209" r="20" fill="#175cd3"/><text x="735.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="768.0" y="205" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Path ends in the extracted package</text><text x="768.0" y="227" font-family="Arial,sans-serif" font-size="18" fill="#24344f">root</text><circle cx="735.0" cy="287" r="20" fill="#175cd3"/><text x="735.0" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="768.0" y="283" font-family="Arial,sans-serif" font-size="18" fill="#24344f">No command is running yet</text><circle cx="735.0" cy="365" r="20" fill="#175cd3"/><text x="735.0" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="768.0" y="361" font-family="Arial,sans-serif" font-size="18" fill="#24344f">You can copy one command at a time</text><circle cx="735.0" cy="443" r="20" fill="#175cd3"/><text x="735.0" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="768.0" y="439" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Press Enter once per command</text><text x="60" y="550" font-family="Arial,sans-serif" font-size="18" fill="#5a6880">Illustrative interface diagram - labels may vary by version</text></svg>