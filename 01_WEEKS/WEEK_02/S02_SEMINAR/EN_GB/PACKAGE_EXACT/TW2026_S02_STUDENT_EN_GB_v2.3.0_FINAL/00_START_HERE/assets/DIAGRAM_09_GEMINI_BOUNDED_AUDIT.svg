<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="592" viewBox="0 0 1400 592">
    <rect width="100%" height="100%" fill="#f5f7fb"/>
    <rect x="0" y="0" width="100%" height="118" fill="#13233f"/>
    <text x="60" y="52" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="white">Controlled Gemini audit</text>
    <text x="60" y="88" font-family="Arial,sans-serif" font-size="21" fill="#dbe7ff">Gemini proposes; independent evidence decides</text><rect x="60.0" y="132" width="618.0" height="334" rx="16" fill="white" stroke="#b8c6dc" stroke-width="2"/><text x="84.0" y="174" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#13233f">Before sending</text><circle cx="95.0" cy="209" r="20" fill="#175cd3"/><text x="95.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="128.0" y="205" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Open a new chat</text><circle cx="95.0" cy="287" r="20" fill="#175cd3"/><text x="95.0" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="128.0" y="283" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Paste the bounded prompt</text><circle cx="95.0" cy="365" r="20" fill="#175cd3"/><text x="95.0" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="128.0" y="361" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Remove personal or institutional</text><text x="128.0" y="383" font-family="Arial,sans-serif" font-size="18" fill="#24344f">data</text><circle cx="95.0" cy="443" r="20" fill="#175cd3"/><text x="95.0" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="128.0" y="439" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Send once</text><rect x="700.0" y="132" width="618.0" height="334" rx="16" fill="white" stroke="#b8c6dc" stroke-width="2"/><text x="724.0" y="174" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#13233f">After the response</text><circle cx="735.0" cy="209" r="20" fill="#175cd3"/><text x="735.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="768.0" y="205" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Extract one specific claim</text><circle cx="735.0" cy="287" r="20" fill="#175cd3"/><text x="735.0" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="768.0" y="283" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Classify Observed, Inferred or</text><text x="768.0" y="305" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Unknown</text><circle cx="735.0" cy="365" r="20" fill="#175cd3"/><text x="735.0" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="768.0" y="361" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Verify with test, source or</text><text x="768.0" y="383" font-family="Arial,sans-serif" font-size="18" fill="#24344f">browser evidence</text><circle cx="735.0" cy="443" r="20" fill="#175cd3"/><text x="735.0" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="768.0" y="439" font-family="Arial,sans-serif" font-size="18" fill="#24344f">Assign a verdict and state the</text><text x="768.0" y="461" font-family="Arial,sans-serif" font-size="18" fill="#24344f">limit</text><text x="60" y="550" font-family="Arial,sans-serif" font-size="18" fill="#5a6880">Illustrative interface diagram - labels may vary by version</text></svg>