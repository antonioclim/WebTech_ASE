<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Evidence matrix</title><desc id="d">Examples of claims mapped to suitable evidence and the limit of that evidence.</desc><rect width="1200" height="675" fill="#f6f2ea"/><style>text{font-family:Arial,sans-serif;fill:#172026}.h{font-size:42px;font-weight:700}.m{font-size:26px;font-weight:700}.s{font-size:20px}.box{fill:#fff;stroke:#0f766e;stroke-width:3}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.line{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#a)}.muted{fill:#536069}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><text x="60" y="70" class="h">Evidence matrix</text><rect x="60" y="160" width="340" height="70" rx="10" class="box"/><text x="230" y="205" text-anchor="middle" class="m">Claim</text><rect x="420" y="160" width="340" height="70" rx="10" class="box"/><text x="590" y="205" text-anchor="middle" class="m">Evidence</text><rect x="780" y="160" width="340" height="70" rx="10" class="box"/><text x="950" y="205" text-anchor="middle" class="m">Limit</text><rect x="60" y="250" width="340" height="85" rx="10" class="warn"/><text x="230" y="300" text-anchor="middle" class="s">Accessible name</text><rect x="420" y="250" width="340" height="85" rx="10" class="warn"/><text x="590" y="300" text-anchor="middle" class="s">DOM / accessibility tree</text><rect x="780" y="250" width="340" height="85" rx="10" class="warn"/><text x="950" y="300" text-anchor="middle" class="s">does not prove operation</text><rect x="60" y="355" width="340" height="85" rx="10" class="warn"/><text x="230" y="405" text-anchor="middle" class="s">Winning rule</text><rect x="420" y="355" width="340" height="85" rx="10" class="warn"/><text x="590" y="405" text-anchor="middle" class="s">computed style</text><rect x="780" y="355" width="340" height="85" rx="10" class="warn"/><text x="950" y="405" text-anchor="middle" class="s">does not prove contrast</text><rect x="60" y="460" width="340" height="85" rx="10" class="warn"/><text x="230" y="510" text-anchor="middle" class="s">Content preserved</text><rect x="420" y="460" width="340" height="85" rx="10" class="warn"/><text x="590" y="510" text-anchor="middle" class="s">320 / zoom / text states</text><rect x="780" y="460" width="340" height="85" rx="10" class="warn"/><text x="950" y="510" text-anchor="middle" class="s">does not cover every input</text></svg>