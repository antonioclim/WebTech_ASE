<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Procesul cascadei în demonstraţia C02</title><desc id="d">Etapele declarate ale demonstraţiei: relevanţă, origine şi importanţă, strat, specificitate şi ordine.</desc><rect width="1200" height="675" fill="#f6f2ea"/><style>text{font-family:Arial,sans-serif;fill:#172026}.h{font-size:42px;font-weight:700}.m{font-size:26px;font-weight:700}.s{font-size:20px}.box{fill:#fff;stroke:#0f766e;stroke-width:3}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.line{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#a)}.muted{fill:#536069}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><text x="60" y="70" class="h">Procesul cascadei în demonstraţia C02</text><rect x="35" y="245" width="200" height="105" rx="18" class="box"/><text x="135" y="300" text-anchor="middle" class="s">Relevanţă</text><path d="M235 298 L260 298" class="line"/><rect x="265" y="245" width="200" height="105" rx="18" class="box"/><text x="365" y="300" text-anchor="middle" class="s">Origine / importanţă</text><path d="M465 298 L490 298" class="line"/><rect x="495" y="245" width="200" height="105" rx="18" class="box"/><text x="595" y="300" text-anchor="middle" class="s">Strat</text><path d="M695 298 L720 298" class="line"/><rect x="725" y="245" width="200" height="105" rx="18" class="box"/><text x="825" y="300" text-anchor="middle" class="s">Specificitate</text><path d="M925 298 L950 298" class="line"/><rect x="955" y="245" width="200" height="105" rx="18" class="box"/><text x="1055" y="300" text-anchor="middle" class="s">Ordine</text></svg>