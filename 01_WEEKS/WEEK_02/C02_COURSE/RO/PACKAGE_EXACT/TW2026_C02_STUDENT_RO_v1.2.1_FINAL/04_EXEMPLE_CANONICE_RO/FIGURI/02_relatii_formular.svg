<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Relaţiile unui control de formular</title><desc id="d">Numele, descrierea, gruparea şi starea sunt relaţii distincte conectate controlului.</desc><rect width="1200" height="675" fill="#f6f2ea"/><style>text{font-family:Arial,sans-serif;fill:#172026}.h{font-size:42px;font-weight:700}.m{font-size:26px;font-weight:700}.s{font-size:20px}.box{fill:#fff;stroke:#0f766e;stroke-width:3}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.line{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#a)}.muted{fill:#536069}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><text x="60" y="70" class="h">Relaţiile unui control de formular</text><rect x="460" y="250" width="280" height="120" rx="22" class="box"/><text x="600" y="320" text-anchor="middle" class="m">Control</text><rect x="120" y="170" width="230" height="90" rx="18" class="warn"/><text x="235" y="225" text-anchor="middle" class="m">Nume</text><path d="M350 215 L460 310" class="line"/><rect x="850" y="170" width="230" height="90" rx="18" class="warn"/><text x="965" y="225" text-anchor="middle" class="m">Descriere</text><path d="M850 215 L740 310" class="line"/><rect x="120" y="430" width="230" height="90" rx="18" class="warn"/><text x="235" y="485" text-anchor="middle" class="m">Grup</text><path d="M350 475 L460 310" class="line"/><rect x="850" y="430" width="230" height="90" rx="18" class="warn"/><text x="965" y="485" text-anchor="middle" class="m">Stare</text><path d="M850 475 L740 310" class="line"/></svg>