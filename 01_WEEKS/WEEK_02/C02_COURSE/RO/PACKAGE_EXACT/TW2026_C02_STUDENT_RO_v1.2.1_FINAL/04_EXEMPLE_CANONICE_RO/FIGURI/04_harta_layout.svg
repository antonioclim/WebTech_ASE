<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Harta responsabilităţii layoutului</title><desc id="d">Patru mecanisme de layout, fiecare asociat relaţiei pe care o exprimă.</desc><rect width="1200" height="675" fill="#f6f2ea"/><style>text{font-family:Arial,sans-serif;fill:#172026}.h{font-size:42px;font-weight:700}.m{font-size:26px;font-weight:700}.s{font-size:20px}.box{fill:#fff;stroke:#0f766e;stroke-width:3}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.line{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#a)}.muted{fill:#536069}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><text x="60" y="70" class="h">Harta responsabilităţii layoutului</text><rect x="75" y="230" width="235" height="160" rx="20" class="box"/><text x="192" y="295" text-anchor="middle" class="m">Flux normal</text><text x="192" y="340" text-anchor="middle" class="s muted">progresie</text><rect x="355" y="230" width="235" height="160" rx="20" class="box"/><text x="472" y="295" text-anchor="middle" class="m">Flexbox</text><text x="472" y="340" text-anchor="middle" class="s muted">o axă</text><rect x="635" y="230" width="235" height="160" rx="20" class="box"/><text x="752" y="295" text-anchor="middle" class="m">Grid</text><text x="752" y="340" text-anchor="middle" class="s muted">două axe</text><rect x="915" y="230" width="235" height="160" rx="20" class="box"/><text x="1032" y="295" text-anchor="middle" class="m">Poziţionare</text><text x="1032" y="340" text-anchor="middle" class="s muted">suprapunere</text></svg>