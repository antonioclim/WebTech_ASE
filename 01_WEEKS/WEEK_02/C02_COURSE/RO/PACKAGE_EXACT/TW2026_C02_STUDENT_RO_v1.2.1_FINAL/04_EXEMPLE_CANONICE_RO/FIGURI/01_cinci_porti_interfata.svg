<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Cinci porţi ale unei interfeţe</title><desc id="d">Un traseu de la semnificaţia documentului la dovada care susţine afirmaţia.</desc><rect width="1200" height="675" fill="#f6f2ea"/><style>text{font-family:Arial,sans-serif;fill:#172026}.h{font-size:42px;font-weight:700}.m{font-size:26px;font-weight:700}.s{font-size:20px}.box{fill:#fff;stroke:#0f766e;stroke-width:3}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.line{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#a)}.muted{fill:#536069}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><text x="60" y="70" class="h">Cinci porţi ale unei interfeţe</text><rect x="60" y="240" width="180" height="120" rx="20" class="box"/><text x="150" y="300" text-anchor="middle" class="m">Semnificaţie</text><path d="M240 300 L280 300" class="line"/><rect x="285" y="240" width="180" height="120" rx="20" class="box"/><text x="375" y="300" text-anchor="middle" class="m">Cascadă</text><path d="M465 300 L505 300" class="line"/><rect x="510" y="240" width="180" height="120" rx="20" class="box"/><text x="600" y="300" text-anchor="middle" class="m">Geometrie</text><path d="M690 300 L730 300" class="line"/><rect x="735" y="240" width="180" height="120" rx="20" class="box"/><text x="825" y="300" text-anchor="middle" class="m">Interacţiune</text><path d="M915 300 L955 300" class="line"/><rect x="960" y="240" width="180" height="120" rx="20" class="box"/><text x="1050" y="300" text-anchor="middle" class="m">Dovadă</text></svg>