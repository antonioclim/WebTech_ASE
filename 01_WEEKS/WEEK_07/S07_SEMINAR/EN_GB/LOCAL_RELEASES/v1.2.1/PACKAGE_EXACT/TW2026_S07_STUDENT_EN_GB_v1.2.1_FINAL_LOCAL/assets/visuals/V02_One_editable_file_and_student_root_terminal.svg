<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="V02-title V02-desc"><title id="V02-title">One editable file and student-root terminal</title><desc id="V02-desc">Illustrative source-derived teaching diagram. Not a capture of any current native interface.</desc><rect width="960" height="420" fill="#fffdf8"/><g font-family="system-ui, sans-serif"><text x="24" y="34" font-size="22" font-weight="700" fill="#163641">One editable file and student-root terminal</text><text x="24" y="61" font-size="12" font-weight="700" fill="#93551b">SCHEMATIC — NOT A CAPTURE OF YOUR CURRENT INTERFACE</text><rect x="30" y="95" width="350" height="190" rx="8" fill="#e1efec" stroke="#516d73"/><text x="44" y="121" font-size="17" fill="#17343f">EXPLORER (illustrative)</text><text x="44" y="144" font-size="17" fill="#17343f">02_PROJECTS / p02 / src</text><text x="44" y="167" font-size="17" fill="#17343f">book-seats.js ← permitted edit</text><text x="44" y="190" font-size="17" fill="#17343f">models.js / app.js ← preserve</text><text x="44" y="213" font-size="17" fill="#17343f">tests / package files ← preserve</text><rect x="410" y="95" width="515" height="130" rx="8" fill="#e1efec" stroke="#516d73"/><text x="424" y="121" font-size="17" fill="#17343f">BREADCRUMB</text><text x="424" y="144" font-size="17" fill="#17343f">02_PROJECTS › p02 › src › book-seats.js</text><text x="424" y="167" font-size="17" fill="#17343f">Read contract beside your own target</text><rect x="410" y="245" width="515" height="100" rx="8" fill="#e1efec" stroke="#516d73"/><text x="424" y="271" font-size="17" fill="#17343f">TERMINAL WORKING DIRECTORY</text><text x="424" y="294" font-size="17" fill="#17343f">Student root contains tools and PACKAGE_ID.txt</text><text x="424" y="317" font-size="17" fill="#17343f">node tools/cli.mjs boundary p02</text></g></svg>
