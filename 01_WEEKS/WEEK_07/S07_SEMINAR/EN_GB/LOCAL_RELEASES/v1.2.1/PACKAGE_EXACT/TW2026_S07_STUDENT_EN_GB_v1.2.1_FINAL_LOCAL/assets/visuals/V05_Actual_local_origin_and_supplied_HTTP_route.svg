<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="V05-title V05-desc"><title id="V05-title">Actual local origin and supplied HTTP route</title><desc id="V05-desc">Illustrative source-derived teaching diagram. Not a capture of any current native interface.</desc><rect width="960" height="420" fill="#fffdf8"/><g font-family="system-ui, sans-serif"><text x="24" y="34" font-size="22" font-weight="700" fill="#163641">Actual local origin and supplied HTTP route</text><text x="24" y="61" font-size="12" font-weight="700" fill="#93551b">SCHEMATIC — NOT A CAPTURE OF YOUR CURRENT INTERFACE</text><rect x="30" y="100" width="895" height="76" rx="8" fill="#e1efec" stroke="#516d73"/><text x="44" y="126" font-size="17" fill="#17343f">READY prints actual http://127.0.0.1:PORT (port chosen by launcher)</text><text x="44" y="149" font-size="17" fill="#17343f">The offline guide file: tab is not application HTTP evidence.</text><rect x="30" y="210" width="420" height="113" rx="8" fill="#e1efec" stroke="#516d73"/><text x="44" y="236" font-size="17" fill="#17343f">SUPPLIED POST</text><text x="44" y="259" font-size="17" fill="#17343f">/api/events/:eventId/bookings</text><text x="44" y="282" font-size="17" fill="#17343f">Expected 201 + detached data</text><rect x="485" y="210" width="440" height="113" rx="8" fill="#f5e4ce" stroke="#516d73"/><text x="499" y="236" font-size="17" fill="#17343f">LOCATION /api/bookings/:id</text><text x="499" y="259" font-size="17" fill="#17343f">Names a booking identity</text><text x="499" y="282" font-size="17" fill="#17343f">No supplied GET member route</text><text x="30" y="370" font-size="17" fill="#163641">HTTP status does not expose database rows. Use separate ORM witnesses.</text></g></svg>
