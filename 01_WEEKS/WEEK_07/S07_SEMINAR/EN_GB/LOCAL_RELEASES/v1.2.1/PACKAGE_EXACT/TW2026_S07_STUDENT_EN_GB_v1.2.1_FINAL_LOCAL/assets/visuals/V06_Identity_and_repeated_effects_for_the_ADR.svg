<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="V06-title V06-desc"><title id="V06-title">Identity and repeated effects for the ADR</title><desc id="V06-desc">Illustrative source-derived teaching diagram. Not a capture of any current native interface.</desc><rect width="960" height="420" fill="#fffdf8"/><g font-family="system-ui, sans-serif"><text x="24" y="34" font-size="22" font-weight="700" fill="#163641">Identity and repeated effects for the ADR</text><text x="24" y="61" font-size="12" font-weight="700" fill="#93551b">SCHEMATIC — NOT A CAPTURE OF YOUR CURRENT INTERFACE</text><rect x="30" y="100" width="410" height="150" rx="8" fill="#f5e4ce" stroke="#516d73"/><text x="44" y="126" font-size="17" fill="#17343f">P02 booking POST</text><text x="44" y="149" font-size="17" fill="#17343f">Create booking operation</text><text x="44" y="172" font-size="17" fill="#17343f">Not automatically idempotent</text><text x="44" y="195" font-size="17" fill="#17343f">No automatic retry claim</text><rect x="480" y="100" width="445" height="150" rx="8" fill="#e1efec" stroke="#516d73"/><text x="494" y="126" font-size="17" fill="#17343f">P03 membership PUT / DELETE</text><text x="494" y="149" font-size="17" fill="#17343f">Identity: sessionId + attendeeId</text><text x="494" y="172" font-size="17" fill="#17343f">Repeated target-state effects</text><text x="494" y="195" font-size="17" fill="#17343f">Status category can differ</text><rect x="30" y="285" width="895" height="77" rx="8" fill="#e1efec" stroke="#516d73"/><text x="44" y="311" font-size="17" fill="#17343f">ADR: eight blank repeat-table rows, source reasoning allowed</text><text x="44" y="334" font-size="17" fill="#17343f">Compare alternatives, transaction owner, consequences and review trigger.</text></g></svg>
