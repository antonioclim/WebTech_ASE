<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="V03-title V03-desc"><title id="V03-title">Five ORM operations inside one boundary</title><desc id="V03-desc">Illustrative source-derived teaching diagram. Not a capture of any current native interface.</desc><rect width="960" height="490" fill="#fffdf8"/><g font-family="system-ui, sans-serif"><text x="24" y="34" font-size="22" font-weight="700" fill="#163641">Five ORM operations inside one boundary</text><text x="24" y="61" font-size="12" font-weight="700" fill="#93551b">SCHEMATIC — NOT A CAPTURE OF YOUR CURRENT INTERFACE</text><rect x="25" y="92" width="910" height="330" rx="12" fill="#eff7f2" stroke="#066777" stroke-width="3"/><text x="43" y="121" font-size="18" font-weight="700" fill="#145562">ONE MANAGED TRANSACTION — same non-null option identity</text><rect x="48" y="145" width="575" height="39" rx="8" fill="#fffdf8" stroke="#516d73"/><text x="62" y="171" font-size="17" fill="#17343f">1 Event.findByPk</text><rect x="48" y="194" width="575" height="39" rx="8" fill="#fffdf8" stroke="#516d73"/><text x="62" y="220" font-size="17" fill="#17343f">2 Booking.findOne</text><rect x="48" y="243" width="575" height="39" rx="8" fill="#fffdf8" stroke="#516d73"/><text x="62" y="269" font-size="17" fill="#17343f">3 event.save</text><rect x="48" y="292" width="575" height="39" rx="8" fill="#fffdf8" stroke="#516d73"/><text x="62" y="318" font-size="17" fill="#17343f">4 Booking.create</text><rect x="48" y="341" width="575" height="39" rx="8" fill="#fffdf8" stroke="#516d73"/><text x="62" y="367" font-size="17" fill="#17343f">5 BookingAudit.create</text><rect x="650" y="195" width="259" height="86" rx="8" fill="#f5e4ce" stroke="#516d73"/><text x="664" y="221" font-size="17" fill="#17343f">After Booking.create:</text><text x="664" y="244" font-size="17" fill="#17343f">await injected callback</text><text x="664" y="267" font-size="17" fill="#17343f">then audit creation</text><text x="45" y="452" font-size="17" fill="#163641">Invalid seats: before boundary. Outer result: after managed settlement.</text></g></svg>
