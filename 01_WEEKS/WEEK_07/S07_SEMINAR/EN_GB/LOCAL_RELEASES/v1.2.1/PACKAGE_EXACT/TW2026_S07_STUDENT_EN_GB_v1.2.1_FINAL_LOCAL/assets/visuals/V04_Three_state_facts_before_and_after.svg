<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="V04-title V04-desc"><title id="V04-title">Three state facts before and after</title><desc id="V04-desc">Illustrative source-derived teaching diagram. Not a capture of any current native interface.</desc><rect width="960" height="450" fill="#fffdf8"/><g font-family="system-ui, sans-serif"><text x="24" y="34" font-size="22" font-weight="700" fill="#163641">Three state facts before and after</text><text x="24" y="61" font-size="12" font-weight="700" fill="#93551b">SCHEMATIC — NOT A CAPTURE OF YOUR CURRENT INTERFACE</text><text x="30" y="98" font-size="17" fill="#8b4818">SOURCE EXPECTATIONS — NOT OBSERVED PRODUCTION RESULTS</text><rect x="30" y="125" width="895" height="58" rx="8" fill="#e7edee" stroke="#516d73"/><text x="44" y="151" font-size="17" fill="#17343f">Fresh state          available 5 | Booking 0 | Audit 0</text><rect x="30" y="205" width="895" height="58" rx="8" fill="#e1efec" stroke="#516d73"/><text x="44" y="231" font-size="17" fill="#17343f">Managed success      available 3 | Booking 1 | Audit 1</text><rect x="30" y="285" width="895" height="58" rx="8" fill="#f5e4ce" stroke="#516d73"/><text x="44" y="311" font-size="17" fill="#17343f">Unsafe late failure  available 3 | Booking 1 | Audit 0</text><rect x="30" y="365" width="895" height="58" rx="8" fill="#e1efec" stroke="#516d73"/><text x="44" y="391" font-size="17" fill="#17343f">Managed late failure exact before-state retained</text></g></svg>
