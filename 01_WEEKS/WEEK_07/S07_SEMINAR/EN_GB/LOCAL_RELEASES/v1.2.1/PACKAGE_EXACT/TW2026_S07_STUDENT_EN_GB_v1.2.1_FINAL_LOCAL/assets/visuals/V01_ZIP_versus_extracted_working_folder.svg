<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="V01-title V01-desc"><title id="V01-title">ZIP versus extracted working folder</title><desc id="V01-desc">Illustrative source-derived teaching diagram. Not a capture of any current native interface.</desc><rect width="960" height="420" fill="#fffdf8"/><g font-family="system-ui, sans-serif"><text x="24" y="34" font-size="22" font-weight="700" fill="#163641">ZIP versus extracted working folder</text><text x="24" y="61" font-size="12" font-weight="700" fill="#93551b">SCHEMATIC — NOT A CAPTURE OF YOUR CURRENT INTERFACE</text><rect x="30" y="100" width="400" height="100" rx="8" fill="#f5e4ce" stroke="#516d73"/><text x="44" y="126" font-size="17" fill="#17343f">Student archive.zip</text><text x="44" y="149" font-size="17" fill="#17343f">archive.zip.sha256</text><text x="44" y="172" font-size="17" fill="#17343f">Keep both original files</text><rect x="520" y="100" width="405" height="100" rx="8" fill="#e1efec" stroke="#516d73"/><text x="534" y="126" font-size="17" fill="#17343f">Extracted student folder</text><text x="534" y="149" font-size="17" fill="#17343f">00_START_HERE / 02_PROJECTS</text><text x="534" y="172" font-size="17" fill="#17343f">tools / PACKAGE_ID.txt</text><path d="M444 148 L497 148" stroke="#076571" stroke-width="4"/><path d="M485 139 L499 148 L485 157" fill="none" stroke="#076571" stroke-width="4"/><rect x="30" y="240" width="895" height="102" rx="8" fill="#e1efec" stroke="#516d73"/><text x="44" y="266" font-size="17" fill="#17343f">Illustrative Windows path: D:\#___MY_SPACE\Downloads\s07</text><text x="44" y="289" font-size="17" fill="#17343f">Spaces and # are permitted when quoted. Open the extracted copy.</text><text x="44" y="312" font-size="17" fill="#17343f">Archive preview is not the working directory.</text></g></svg>
