<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="V07-title V07-desc"><title id="V07-title">One final PDF and final submission state</title><desc id="V07-desc">Illustrative source-derived teaching diagram. Not a capture of any current native interface.</desc><rect width="960" height="420" fill="#fffdf8"/><g font-family="system-ui, sans-serif"><text x="24" y="34" font-size="22" font-weight="700" fill="#163641">One final PDF and final submission state</text><text x="24" y="61" font-size="12" font-weight="700" fill="#93551b">SCHEMATIC — NOT A CAPTURE OF YOUR CURRENT INTERFACE</text><rect x="30" y="100" width="420" height="105" rx="8" fill="#f5e4ce" stroke="#516d73"/><text x="44" y="126" font-size="17" fill="#17343f">EDITABLE DRAFTS</text><text x="44" y="149" font-size="17" fill="#17343f">Form JSON / optional DOCX</text><text x="44" y="172" font-size="17" fill="#17343f">Private working materials</text><rect x="485" y="100" width="440" height="105" rx="8" fill="#e1efec" stroke="#516d73"/><text x="499" y="126" font-size="17" fill="#17343f">ONE FINAL S07 PDF</text><text x="499" y="149" font-size="17" fill="#17343f">TW2026_S07_GROUP_</text><text x="499" y="172" font-size="17" fill="#17343f">Surname_Firstname.pdf</text><rect x="30" y="255" width="895" height="98" rx="8" fill="#e1efec" stroke="#516d73"/><text x="44" y="281" font-size="17" fill="#17343f">Seven sections reviewed · privacy checked · truthful declaration</text><text x="44" y="304" font-size="17" fill="#17343f">Moodle proposed state: saved draft ≠ final submitted</text><text x="44" y="327" font-size="17" fill="#17343f">Use actual configured instructions and later stated deadline.</text></g></svg>
