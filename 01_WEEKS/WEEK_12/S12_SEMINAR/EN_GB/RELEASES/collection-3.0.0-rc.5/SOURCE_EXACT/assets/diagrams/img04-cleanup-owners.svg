<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" role="img" aria-labelledby="title desc"><title id="title">Zero pending has a narrow owner</title><desc id="desc">Illustrative interface diagram: terminal settlement removes pending, request timer and abort listener; dispatcher subscriptions stay while usable and disposal removes them; adapter, socket and remote work remain separate owners. 1 measures request-owned resources. 2 measures dispatcher-owned subscriptions at disposal. 3 needs its own evidence. Local abort does not establish remote cancellation.</desc><rect width="960" height="456" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#122b35"><text x="32" y="34" font-size="17" font-weight="700" fill="#8a4d00">Illustrative interface diagram · IMG04</text><text x="32" y="75" font-size="28" font-weight="700">Zero pending has a narrow owner</text><rect x="32" y="104" width="896" height="88" rx="12" fill="#e8f5f4" stroke="#53767f"/><circle cx="69" cy="146" r="23" fill="#0a5865"/><text x="69" y="153" text-anchor="middle" fill="white" font-size="23" font-weight="700">1</text><text x="112" y="137" font-size="23" font-weight="700">Request terminal settlement</text><text x="112" y="168" font-size="21">pending 0 · request timers 0 · abort listeners 0</text><rect x="32" y="208" width="896" height="88" rx="12" fill="#e8f5f4" stroke="#53767f"/><circle cx="69" cy="250" r="23" fill="#0a5865"/><text x="69" y="257" text-anchor="middle" fill="white" font-size="23" font-weight="700">2</text><text x="112" y="241" font-size="23" font-weight="700">Usable dispatcher → disposal</text><text x="112" y="272" font-size="21">subscription pair 1/1 → 0/0</text><rect x="32" y="312" width="896" height="88" rx="12" fill="#fff0dc" stroke="#53767f"/><circle cx="69" cy="354" r="23" fill="#0a5865"/><text x="69" y="361" text-anchor="middle" fill="white" font-size="23" font-weight="700">3</text><text x="112" y="345" font-size="23" font-weight="700">Separate owners remain</text><text x="112" y="376" font-size="21">adapter socket listeners · socket · remote work</text><text x="32" y="441" font-size="16" fill="#36505b">Numbered callouts explained in the adjacent guide legend. Constructed diagram; not a screenshot.</text></g></svg>
