<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" role="img" aria-labelledby="title desc"><title id="title">Network belongs to the selected tab</title><desc id="desc">Illustrative interface diagram: the intended local application tab begins http://127.0.0.1 with its actual port; a chatgpt.com tab is a wrong-tab example and its traffic must not be copied. 1 requires a real prepared local app and actual port. 2 belongs to that tab. 3 is a wrong domain example. No server is started by this guide and no real capture is shown.</desc><rect width="960" height="456" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#122b35"><text x="32" y="34" font-size="17" font-weight="700" fill="#8a4d00">Illustrative interface diagram · IMG05</text><text x="32" y="75" font-size="28" font-weight="700">Network belongs to the selected tab</text><rect x="32" y="104" width="896" height="88" rx="12" fill="#e8f5f4" stroke="#53767f"/><circle cx="69" cy="146" r="23" fill="#0a5865"/><text x="69" y="153" text-anchor="middle" fill="white" font-size="23" font-weight="700">1</text><text x="112" y="137" font-size="23" font-weight="700">Correct prepared application tab</text><text x="112" y="168" font-size="21">http://127.0.0.1:&lt;actual-port&gt;/</text><rect x="32" y="208" width="896" height="88" rx="12" fill="#e8f5f4" stroke="#53767f"/><circle cx="69" cy="250" r="23" fill="#0a5865"/><text x="69" y="257" text-anchor="middle" fill="white" font-size="23" font-weight="700">2</text><text x="112" y="241" font-size="23" font-weight="700">Open Network on this tab</text><text x="112" y="272" font-size="21">Identify HTTP request and selected WS connection.</text><rect x="32" y="312" width="896" height="88" rx="12" fill="#fff0dc" stroke="#53767f"/><circle cx="69" cy="354" r="23" fill="#0a5865"/><text x="69" y="361" text-anchor="middle" fill="white" font-size="23" font-weight="700">3</text><text x="112" y="345" font-size="23" font-weight="700">Wrong-tab example</text><text x="112" y="376" font-size="21">chatgpt.com — unrelated private traffic</text><text x="32" y="441" font-size="16" fill="#36505b">Numbered callouts explained in the adjacent guide legend. Constructed diagram; not a screenshot.</text></g></svg>
