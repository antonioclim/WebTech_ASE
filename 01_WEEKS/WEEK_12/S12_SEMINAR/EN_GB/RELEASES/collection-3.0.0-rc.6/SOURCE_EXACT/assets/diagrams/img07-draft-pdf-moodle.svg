<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" role="img" aria-labelledby="title desc"><title id="title">A saved draft is not final submission</title><desc id="desc">Illustrative interface diagram: truthful draft first, current reviewed one-PDF evidence second and actual Moodle final status with filename and timestamp third; Draft is a stop. 1 may be incomplete. 2 requires review and actual required evidence for normal completion. 3 is observed in the real instance. Save changes can leave Draft: STOP.</desc><rect width="960" height="456" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#122b35"><text x="32" y="34" font-size="17" font-weight="700" fill="#8a4d00">Illustrative interface diagram · IMG07</text><text x="32" y="75" font-size="28" font-weight="700">A saved draft is not final submission</text><rect x="32" y="104" width="896" height="88" rx="12" fill="#e8f5f4" stroke="#53767f"/><circle cx="69" cy="146" r="23" fill="#0a5865"/><text x="69" y="153" text-anchor="middle" fill="white" font-size="23" font-weight="700">1</text><text x="112" y="137" font-size="23" font-weight="700">Truthful local evidence draft</text><text x="112" y="168" font-size="21">Blocks remain visible; no synthetic Gemini reply.</text><rect x="32" y="208" width="896" height="88" rx="12" fill="#e8f5f4" stroke="#53767f"/><circle cx="69" cy="250" r="23" fill="#0a5865"/><text x="69" y="257" text-anchor="middle" fill="white" font-size="23" font-weight="700">2</text><text x="112" y="241" font-size="23" font-weight="700">Current reviewed PDF</text><text x="112" y="272" font-size="21">TW2026_S12_CODE.pdf · inspect every page</text><rect x="32" y="312" width="896" height="88" rx="12" fill="#fff0dc" stroke="#53767f"/><circle cx="69" cy="354" r="23" fill="#0a5865"/><text x="69" y="361" text-anchor="middle" fill="white" font-size="23" font-weight="700">3</text><text x="112" y="345" font-size="23" font-weight="700">Actual Moodle final receipt</text><text x="112" y="376" font-size="21">Final status + correct filename + real timestamp</text><text x="32" y="441" font-size="16" fill="#36505b">Numbered callouts explained in the adjacent guide legend. Constructed diagram; not a screenshot.</text></g></svg>
