<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" role="img" aria-labelledby="title desc"><title id="title">Replies arrive r3, r1, r2</title><desc id="desc">Illustrative interface diagram: three callers issue r1, r2 and r3; replies arrive r3 then r1 then r2 and each opaque ID selects its own caller. 1 is issue order. 2 is deliberately reversed arrival. 3 is the required owner map. Promise.all result order is its input order, not arrival order.</desc><rect width="960" height="456" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#122b35"><text x="32" y="34" font-size="17" font-weight="700" fill="#8a4d00">Illustrative interface diagram · IMG02</text><text x="32" y="75" font-size="28" font-weight="700">Replies arrive r3, r1, r2</text><rect x="32" y="104" width="896" height="88" rx="12" fill="#e8f5f4" stroke="#53767f"/><circle cx="69" cy="146" r="23" fill="#0a5865"/><text x="69" y="153" text-anchor="middle" fill="white" font-size="23" font-weight="700">1</text><text x="112" y="137" font-size="23" font-weight="700">Requests issued</text><text x="112" y="168" font-size="21">Caller 1:r1 · Caller 2:r2 · Caller 3:r3</text><rect x="32" y="208" width="896" height="88" rx="12" fill="#e8f5f4" stroke="#53767f"/><circle cx="69" cy="250" r="23" fill="#0a5865"/><text x="69" y="257" text-anchor="middle" fill="white" font-size="23" font-weight="700">2</text><text x="112" y="241" font-size="23" font-weight="700">Replies arrive</text><text x="112" y="272" font-size="21">r3 first · r1 second · r2 third</text><rect x="32" y="312" width="896" height="88" rx="12" fill="#fff0dc" stroke="#53767f"/><circle cx="69" cy="354" r="23" fill="#0a5865"/><text x="69" y="361" text-anchor="middle" fill="white" font-size="23" font-weight="700">3</text><text x="112" y="345" font-size="23" font-weight="700">Ownership by matching ID</text><text x="112" y="376" font-size="21">r3→caller 3 · r1→caller 1 · r2→caller 2</text><text x="32" y="441" font-size="16" fill="#36505b">Numbered callouts explained in the adjacent guide legend. Constructed diagram; not a screenshot.</text></g></svg>
