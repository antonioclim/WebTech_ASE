<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" role="img" aria-labelledby="title desc"><title id="title">HTTP 202 is acceptance, not completion</title><desc id="desc">Illustrative interface diagram: a request is accepted by HTTP 202; principal and connection identity target a later WebSocket result with requestId; failure or disconnection can occur between them. 1 is HTTP acceptance. 2 is recipient/correlation ownership. 3 is a separate later event with separate conditions. Supplied source/model annotation is not an actual protocol run.</desc><rect width="960" height="456" fill="#ffffff"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#122b35"><text x="32" y="34" font-size="17" font-weight="700" fill="#8a4d00">Illustrative interface diagram · IMG06</text><text x="32" y="75" font-size="28" font-weight="700">HTTP 202 is acceptance, not completion</text><rect x="32" y="104" width="896" height="88" rx="12" fill="#e8f5f4" stroke="#53767f"/><circle cx="69" cy="146" r="23" fill="#0a5865"/><text x="69" y="153" text-anchor="middle" fill="white" font-size="23" font-weight="700">1</text><text x="112" y="137" font-size="23" font-weight="700">HTTP response: 202 Accepted</text><text x="112" y="168" font-size="21">Accepted for processing; result not yet known.</text><rect x="32" y="208" width="896" height="88" rx="12" fill="#e8f5f4" stroke="#53767f"/><circle cx="69" cy="250" r="23" fill="#0a5865"/><text x="69" y="257" text-anchor="middle" fill="white" font-size="23" font-weight="700">2</text><text x="112" y="241" font-size="23" font-weight="700">Recipient identity</text><text x="112" y="272" font-size="21">principal + connection identity; requestId correlates.</text><rect x="32" y="312" width="896" height="88" rx="12" fill="#fff0dc" stroke="#53767f"/><circle cx="69" cy="354" r="23" fill="#0a5865"/><text x="69" y="361" text-anchor="middle" fill="white" font-size="23" font-weight="700">3</text><text x="112" y="345" font-size="23" font-weight="700">Later WebSocket outcome</text><text x="112" y="376" font-size="21">Targeted result, failure or no available recipient.</text><text x="32" y="441" font-size="16" fill="#36505b">Numbered callouts explained in the adjacent guide legend. Constructed diagram; not a screenshot.</text></g></svg>
