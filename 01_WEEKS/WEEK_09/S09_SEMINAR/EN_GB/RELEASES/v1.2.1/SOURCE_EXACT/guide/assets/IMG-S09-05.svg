<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">A locator must resolve inside the PDF</title><desc id="desc">Illustrative evidence diagram showing an actual-evidence locator, mock account and token redaction labels and an image embedded in the same PDF. Illustrative interface diagram. Account/token bars are mock redaction labels, not real private data or a runtime screenshot. Capture a safe real region and embed the actual image with its locator in the same PDF.</desc><rect width="1100" height="480" rx="16" fill="#f3f6fa"/><text x="28" y="37" fill="#805400" font-size="19" font-family="Arial, sans-serif" font-weight="normal"><tspan x="28" dy="0">Illustrative interface diagram · S09 v1.2.0</tspan></text><text x="28" y="80" fill="#103b53" font-size="27" font-family="Arial, sans-serif" font-weight="bold"><tspan x="28" dy="0">A locator must resolve inside the PDF</tspan></text><rect x="28" y="122" width="330" height="238" rx="12" fill="#ffffff" stroke="#7896ac" stroke-width="2"/><circle cx="55" cy="152" r="18" fill="#103b53"/><text x="55" y="158" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Arial, sans-serif">1</text><text x="81" y="159" fill="#103b53" font-size="20" font-family="Arial, sans-serif" font-weight="bold"><tspan x="81" dy="0">Actual evidence</tspan></text><text x="45" y="207" fill="#243b53" font-size="19" font-family="Arial, sans-serif" font-weight="normal"><tspan x="45" dy="0">Your own source-bound trace</tspan><tspan x="45" dy="25">or genuine safe capture,</tspan><tspan x="45" dy="25">with a numbered locator.</tspan></text><rect x="386" y="122" width="330" height="238" rx="12" fill="#ffffff" stroke="#7896ac" stroke-width="2"/><circle cx="413" cy="152" r="18" fill="#103b53"/><text x="413" y="158" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Arial, sans-serif">2</text><text x="439" y="159" fill="#103b53" font-size="20" font-family="Arial, sans-serif" font-weight="bold"><tspan x="439" dy="0">Privacy indication</tspan></text><text x="403" y="207" fill="#243b53" font-size="18" font-family="Arial, sans-serif" font-weight="normal"><tspan x="403" dy="0">Account:</tspan></text><rect x="490" y="187" width="204" height="26" rx="4" fill="#183247"/><text x="592" y="205" text-anchor="middle" fill="#ffffff" font-size="15" font-family="Arial, sans-serif">[REDACTED]</text><text x="403" y="250" fill="#243b53" font-size="18" font-family="Arial, sans-serif" font-weight="normal"><tspan x="403" dy="0">Token:</tspan></text><rect x="490" y="230" width="204" height="26" rx="4" fill="#183247"/><text x="592" y="248" text-anchor="middle" fill="#ffffff" font-size="15" font-family="Arial, sans-serif">[REDACTED]</text><text x="403" y="299" fill="#243b53" font-size="18" font-family="Arial, sans-serif" font-weight="normal"><tspan x="403" dy="0">Mock labels only. Recapture</tspan><tspan x="403" dy="25">a safe real region.</tspan></text><rect x="744" y="122" width="330" height="238" rx="12" fill="#ffffff" stroke="#7896ac" stroke-width="2"/><circle cx="771" cy="152" r="18" fill="#103b53"/><text x="771" y="158" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Arial, sans-serif">3</text><text x="797" y="159" fill="#103b53" font-size="20" font-family="Arial, sans-serif" font-weight="bold"><tspan x="797" dy="0">Same PDF</tspan></text><text x="761" y="207" fill="#243b53" font-size="19" font-family="Arial, sans-serif" font-weight="normal"><tspan x="761" dy="0">Embed the actual image and</tspan><tspan x="761" dy="25">causal caption. A filename</tspan><tspan x="761" dy="25">is not an attachment.</tspan></text><text x="28" y="405" fill="#38556b" font-size="17" font-family="Arial, sans-serif" font-weight="normal"><tspan x="28" dy="0">Account/token bars are mock redaction labels, not real private data or a runtime screenshot.</tspan><tspan x="28" dy="25">Capture a safe real region and embed the actual image with its locator in the same PDF.</tspan></text></svg>