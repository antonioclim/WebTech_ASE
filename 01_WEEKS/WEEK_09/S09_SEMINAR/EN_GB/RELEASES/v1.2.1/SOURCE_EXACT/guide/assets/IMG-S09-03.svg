<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">Same destination, different history</title><desc id="desc">Illustrative planned history comparison: push gives notes, new and detail3 with Back to new; replace gives notes and detail3 with Back to notes. This is not an actual trace. Illustrative interface diagram. Planned fresh-seed comparison only: both policies can reach /notes/3, while Back exposes /notes/new after push and /notes after replace. No actual browser run or assessed code is shown.</desc><rect width="1100" height="480" rx="16" fill="#f3f6fa"/><text x="28" y="37" fill="#805400" font-size="19" font-family="Arial, sans-serif" font-weight="normal"><tspan x="28" dy="0">Illustrative interface diagram · S09 v1.2.0</tspan></text><text x="28" y="80" fill="#103b53" font-size="27" font-family="Arial, sans-serif" font-weight="bold"><tspan x="28" dy="0">Same destination, different history</tspan></text><rect x="28" y="122" width="330" height="238" rx="12" fill="#ffffff" stroke="#7896ac" stroke-width="2"/><circle cx="55" cy="152" r="18" fill="#103b53"/><text x="55" y="158" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Arial, sans-serif">1</text><text x="81" y="159" fill="#103b53" font-size="20" font-family="Arial, sans-serif" font-weight="bold"><tspan x="81" dy="0">Starting history</tspan></text><text x="45" y="207" fill="#243b53" font-size="19" font-family="Arial, sans-serif" font-weight="normal"><tspan x="45" dy="0">Fresh seed1/2. Planned</tspan><tspan x="45" dy="25">valid create returns ID3.</tspan></text><text x="45" y="291" fill="#243b53" font-size="17" font-family="Consolas, monospace" font-weight="normal"><tspan x="45" dy="0">[/notes, /notes/new]</tspan></text><rect x="386" y="122" width="330" height="238" rx="12" fill="#ffffff" stroke="#7896ac" stroke-width="2"/><circle cx="413" cy="152" r="18" fill="#103b53"/><text x="413" y="158" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Arial, sans-serif">2</text><text x="439" y="159" fill="#103b53" font-size="20" font-family="Arial, sans-serif" font-weight="bold"><tspan x="439" dy="0">Push comparison</tspan></text><text x="403" y="207" fill="#243b53" font-size="17" font-family="Consolas, monospace" font-weight="normal"><tspan x="403" dy="0">[/notes, /notes/new,</tspan><tspan x="403" dy="25">/notes/3]</tspan></text><text x="403" y="302" fill="#975700" font-size="20" font-family="Arial, sans-serif" font-weight="bold"><tspan x="403" dy="0">Back → /notes/new</tspan></text><rect x="744" y="122" width="330" height="238" rx="12" fill="#ffffff" stroke="#7896ac" stroke-width="2"/><circle cx="771" cy="152" r="18" fill="#103b53"/><text x="771" y="158" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Arial, sans-serif">3</text><text x="797" y="159" fill="#103b53" font-size="20" font-family="Arial, sans-serif" font-weight="bold"><tspan x="797" dy="0">Replace comparison</tspan></text><text x="761" y="207" fill="#243b53" font-size="17" font-family="Consolas, monospace" font-weight="normal"><tspan x="761" dy="0">[/notes, /notes/3]</tspan></text><text x="761" y="302" fill="#103b53" font-size="20" font-family="Arial, sans-serif" font-weight="bold"><tspan x="761" dy="0">Back → /notes</tspan></text><text x="28" y="405" fill="#38556b" font-size="17" font-family="Arial, sans-serif" font-weight="normal"><tspan x="28" dy="0">Planned fresh-seed comparison only: both policies can reach /notes/3, while Back exposes</tspan><tspan x="28" dy="25">/notes/new after push and /notes after replace. No actual browser run or assessed code is shown.</tspan></text></svg>