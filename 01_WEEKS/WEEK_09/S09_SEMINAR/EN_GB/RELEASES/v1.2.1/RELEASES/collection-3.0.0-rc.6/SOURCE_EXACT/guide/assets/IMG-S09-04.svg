<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">Inspect a genuine local request</title><desc id="desc">Illustrative Network inspection diagram with four numbered callouts: correct local tab, request, response and wrong chatgpt.com tab to ignore. Illustrative interface diagram. Inspect only the printed local origin and actual request/response. The chatgpt.com tab is an unrelated example to ignore. Document delivery and client boot remain separate witnesses.</desc><rect width="1100" height="480" rx="16" fill="#f3f6fa"/><text x="28" y="37" fill="#805400" font-size="19" font-family="Arial, sans-serif" font-weight="normal"><tspan x="28" dy="0">Illustrative interface diagram · S09 v1.2.0</tspan></text><text x="28" y="80" fill="#103b53" font-size="27" font-family="Arial, sans-serif" font-weight="bold"><tspan x="28" dy="0">Inspect a genuine local request</tspan></text><rect x="28" y="122" width="252" height="238" rx="12" fill="#ffffff" stroke="#7896ac" stroke-width="2"/><circle cx="55" cy="152" r="18" fill="#103b53"/><text x="55" y="158" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Arial, sans-serif">1</text><text x="81" y="159" fill="#103b53" font-size="20" font-family="Arial, sans-serif" font-weight="bold"><tspan x="81" dy="0">Correct tab</tspan></text><text x="45" y="207" fill="#243b53" font-size="17" font-family="Arial, sans-serif" font-weight="normal"><tspan x="45" dy="0">127.0.0.1: [actual</tspan><tspan x="45" dy="25">port] printed by your</tspan><tspan x="45" dy="25">local server.</tspan></text><rect x="292" y="122" width="252" height="238" rx="12" fill="#ffffff" stroke="#7896ac" stroke-width="2"/><circle cx="319" cy="152" r="18" fill="#103b53"/><text x="319" y="158" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Arial, sans-serif">2</text><text x="345" y="159" fill="#103b53" font-size="20" font-family="Arial, sans-serif" font-weight="bold"><tspan x="345" dy="0">Request</tspan></text><text x="309" y="207" fill="#243b53" font-size="17" font-family="Arial, sans-serif" font-weight="normal"><tspan x="309" dy="0">Record actual method,</tspan><tspan x="309" dy="25">exact path and Accept.</tspan></text><rect x="556" y="122" width="252" height="238" rx="12" fill="#ffffff" stroke="#7896ac" stroke-width="2"/><circle cx="583" cy="152" r="18" fill="#103b53"/><text x="583" y="158" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Arial, sans-serif">3</text><text x="609" y="159" fill="#103b53" font-size="20" font-family="Arial, sans-serif" font-weight="bold"><tspan x="609" dy="0">Response</tspan></text><text x="573" y="207" fill="#243b53" font-size="17" font-family="Arial, sans-serif" font-weight="normal"><tspan x="573" dy="0">Record status/type,</tspan><tspan x="573" dy="25">body identity and log</tspan><tspan x="573" dy="25">order.</tspan></text><rect x="820" y="122" width="252" height="238" rx="12" fill="#fff2df" stroke="#a56710" stroke-width="2"/><circle cx="847" cy="152" r="18" fill="#103b53"/><text x="847" y="158" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Arial, sans-serif">4</text><text x="873" y="159" fill="#103b53" font-size="20" font-family="Arial, sans-serif" font-weight="bold"><tspan x="873" dy="0">Wrong tab</tspan></text><text x="837" y="207" fill="#243b53" font-size="17" font-family="Arial, sans-serif" font-weight="normal"><tspan x="837" dy="0">chatgpt.com is not the</tspan><tspan x="837" dy="25">local app. Ignore its</tspan><tspan x="837" dy="25">requests for S09.</tspan></text><text x="28" y="405" fill="#38556b" font-size="17" font-family="Arial, sans-serif" font-weight="normal"><tspan x="28" dy="0">Inspect only the printed local origin and actual request/response. The chatgpt.com tab is an</tspan><tspan x="28" dy="25">unrelated example to ignore. Document delivery and client boot remain separate witnesses.</tspan></text></svg>