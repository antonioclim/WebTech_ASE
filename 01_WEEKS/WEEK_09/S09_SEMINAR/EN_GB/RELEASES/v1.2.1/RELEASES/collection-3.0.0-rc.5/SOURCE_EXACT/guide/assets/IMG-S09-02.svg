<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">Identify each owner before changing code</title><desc id="desc">Illustrative interface diagram separating URL noteId, the addressed note2 record and the local unsaved title/body draft. Illustrative interface diagram. The URL selects the addressed record; editable title/body remain a local draft until a valid write. P01 storage is volatile, with no durability or authorisation claim.</desc><rect width="1100" height="480" rx="16" fill="#f3f6fa"/><text x="28" y="37" fill="#805400" font-size="19" font-family="Arial, sans-serif" font-weight="normal"><tspan x="28" dy="0">Illustrative interface diagram · S09 v1.2.0</tspan></text><text x="28" y="80" fill="#103b53" font-size="27" font-family="Arial, sans-serif" font-weight="bold"><tspan x="28" dy="0">Identify each owner before changing code</tspan></text><rect x="28" y="122" width="330" height="238" rx="12" fill="#ffffff" stroke="#7896ac" stroke-width="2"/><circle cx="55" cy="152" r="18" fill="#103b53"/><text x="55" y="158" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Arial, sans-serif">1</text><text x="81" y="159" fill="#103b53" font-size="20" font-family="Arial, sans-serif" font-weight="bold"><tspan x="81" dy="0">URL noteId</tspan></text><text x="45" y="207" fill="#243b53" font-size="19" font-family="Arial, sans-serif" font-weight="normal"><tspan x="45" dy="0">/notes/2/edit names the</tspan><tspan x="45" dy="25">current public route and</tspan><tspan x="45" dy="25">resource identity.</tspan></text><rect x="386" y="122" width="330" height="238" rx="12" fill="#ffffff" stroke="#7896ac" stroke-width="2"/><circle cx="413" cy="152" r="18" fill="#103b53"/><text x="413" y="158" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Arial, sans-serif">2</text><text x="439" y="159" fill="#103b53" font-size="20" font-family="Arial, sans-serif" font-weight="bold"><tspan x="439" dy="0">Addressed note</tspan></text><text x="403" y="207" fill="#243b53" font-size="19" font-family="Arial, sans-serif" font-weight="normal"><tspan x="403" dy="0">Seed note2: Controlled</tspan><tspan x="403" dy="25">forms. Read the addressed</tspan><tspan x="403" dy="25">record, not a stale local</tspan><tspan x="403" dy="25">ID.</tspan></text><rect x="744" y="122" width="330" height="238" rx="12" fill="#ffffff" stroke="#7896ac" stroke-width="2"/><circle cx="771" cy="152" r="18" fill="#103b53"/><text x="771" y="158" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Arial, sans-serif">3</text><text x="797" y="159" fill="#103b53" font-size="20" font-family="Arial, sans-serif" font-weight="bold"><tspan x="797" dy="0">Local draft</tspan></text><text x="761" y="207" fill="#243b53" font-size="19" font-family="Arial, sans-serif" font-weight="normal"><tspan x="761" dy="0">Unsaved title/body are</tspan><tspan x="761" dy="25">controlled form values. A</tspan><tspan x="761" dy="25">draft is not a confirmed</tspan><tspan x="761" dy="25">write.</tspan></text><text x="28" y="405" fill="#38556b" font-size="17" font-family="Arial, sans-serif" font-weight="normal"><tspan x="28" dy="0">The URL selects the addressed record; editable title/body remain a local draft until a valid</tspan><tspan x="28" dy="25">write. P01 storage is volatile, with no durability or authorisation claim.</tspan></text></svg>