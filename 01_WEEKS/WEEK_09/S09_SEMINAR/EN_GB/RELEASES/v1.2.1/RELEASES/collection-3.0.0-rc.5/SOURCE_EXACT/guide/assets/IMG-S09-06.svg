<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc"><title id="title">Review one bounded claim independently</title><desc id="desc">Illustrative diagram showing one minimal sanitised prompt, one claim and an independent evidence check. No actual exchange means PENDING. A second model paraphrase is not an experiment.</desc><rect width="1100" height="460" rx="16" fill="#f3f6fa"/><g font-family="Arial, sans-serif"><text x="28" y="38" fill="#805400" font-size="20"><tspan x="28" dy="0">Illustrative interface diagram · S09 v1.2.0</tspan></text><text x="28" y="80" fill="#103b53" font-size="29"><tspan x="28" dy="0">Review one bounded claim independently</tspan></text><rect x="28" y="118" width="330" height="220" rx="12" fill="white" stroke="#7896ac" stroke-width="2"/><circle cx="56" cy="148" r="19" fill="#103b53"/><text x="56" y="155" text-anchor="middle" fill="white" font-size="21">1</text><text x="83" y="155" fill="#103b53" font-size="23"><tspan x="83" dy="0">Minimal prompt</tspan></text><text x="46" y="205" fill="#243b53" font-size="21"><tspan x="46" dy="0">One own claim and sanitised</tspan><tspan x="46" dy="28">excerpt.</tspan></text><rect x="386" y="118" width="330" height="220" rx="12" fill="white" stroke="#7896ac" stroke-width="2"/><circle cx="414" cy="148" r="19" fill="#103b53"/><text x="414" y="155" text-anchor="middle" fill="white" font-size="21">2</text><text x="441" y="155" fill="#103b53" font-size="23"><tspan x="441" dy="0">Actual response</tspan></text><text x="404" y="205" fill="#243b53" font-size="21"><tspan x="404" dy="0">Retain only the relevant</tspan><tspan x="404" dy="28">genuine excerpt.</tspan></text><rect x="744" y="118" width="330" height="220" rx="12" fill="white" stroke="#7896ac" stroke-width="2"/><circle cx="772" cy="148" r="19" fill="#103b53"/><text x="772" y="155" text-anchor="middle" fill="white" font-size="21">3</text><text x="799" y="155" fill="#103b53" font-size="23"><tspan x="799" dy="0">Independent check</tspan></text><text x="762" y="205" fill="#243b53" font-size="21"><tspan x="762" dy="0">Contract/test/diff/actual</tspan><tspan x="762" dy="28">trace with a limit.</tspan></text><text x="28" y="382" fill="#38556b" font-size="20"><tspan x="28" dy="0">No actual exchange means PENDING. A second model paraphrase is not an experiment.</tspan></text></g></svg>