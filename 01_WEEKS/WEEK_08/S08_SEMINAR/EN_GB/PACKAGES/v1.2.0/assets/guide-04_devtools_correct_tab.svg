<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">Correct local tab, origin and storage namespace</title><desc id="desc">Illustrative interface diagram: select the actual local Vite tab and origin, then Chrome or Edge Application Local Storage or Firefox Storage Local Storage. Select only the named S08 teaching key; unrelated private tabs and the guide file are wrong origins.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e7185"/></marker></defs><rect width="1200" height="670" fill="#f8fbfd"/><text x="40" y="43" fill="#173042" font-family="Arial,sans-serif" font-size="29" font-weight="700"><tspan x="40" dy="0">Correct local tab, origin and storage namespace</tspan></text><text x="40" y="76" fill="#496374" font-family="Arial,sans-serif" font-size="17" font-weight="400"><tspan x="40" dy="0">ILLUSTRATIVE INTERFACE DIAGRAM • NOT A SCREENSHOT</tspan></text><rect x="40" y="100" width="1080" height="85" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="58" y="134" fill="#173042" font-family="Arial,sans-serif" font-size="27" font-weight="400"><tspan x="58" dy="0">Select ACTUAL local application tab → exact printed Vite origin</tspan></text><rect x="40" y="225" width="520" height="190" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="58" y="259" fill="#173042" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="58" dy="0">Chrome / Edge — illustrative variant</tspan><tspan x="58" dy="29.900000000000002">Developer tools → Application</tspan><tspan x="58" dy="29.900000000000002">Local Storage → exact local origin</tspan><tspan x="58" dy="29.900000000000002">Select tw2026-s08-p01-react</tspan></text><rect x="600" y="225" width="520" height="190" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="618" y="259" fill="#173042" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="618" dy="0">Firefox — illustrative variant</tspan><tspan x="618" dy="29.900000000000002">Web Developer Tools → Storage</tspan><tspan x="618" dy="29.900000000000002">Local Storage → exact local origin</tspan><tspan x="618" dy="29.900000000000002">Select tw2026-s08-p01-react</tspan></text><rect x="40" y="455" width="1080" height="145" rx="14" fill="#fff0e9" stroke="#ad5530" stroke-width="2"/><text x="58" y="489" fill="#173042" font-family="Arial,sans-serif" font-size="22" font-weight="400"><tspan x="58" dy="0">Wrong origin: file://guide.html, another port or an unrelated private site.</tspan><tspan x="58" dy="28.6">Vanilla common comparison has its separate key: tw2026-s08-p01-vanilla.</tspan><tspan x="58" dy="28.6">Never copy cookies or clear all site data.</tspan></text><text x="40" y="647" fill="#496374" font-family="Arial,sans-serif" font-size="17" font-weight="400"><tspan x="40" dy="0">Legend: blue = owned route or data; orange = limit / counterexample; arrows = action or responsibility.</tspan></text></svg>