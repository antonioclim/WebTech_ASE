<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">Local evidence and institutional submission</title><desc id="desc">Illustrative interface diagram: form preflight, actual saved readable PDF, then a separate institutional upload and explicit final submission. Final filename, timestamp and submitted status are observed after submission; Draft is a stop condition.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e7185"/></marker></defs><rect width="1200" height="670" fill="#f8fbfd"/><text x="40" y="43" fill="#173042" font-family="Arial,sans-serif" font-size="29" font-weight="700"><tspan x="40" dy="0">Local evidence and institutional submission</tspan></text><text x="40" y="76" fill="#496374" font-family="Arial,sans-serif" font-size="17" font-weight="400"><tspan x="40" dy="0">ILLUSTRATIVE INTERFACE DIAGRAM • NOT A SCREENSHOT</tspan></text><rect x="40" y="115" width="440" height="135" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="58" y="149" fill="#173042" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="58" dy="0">1  Local form preflight</tspan><tspan x="58" dy="29.900000000000002">Required P01 + P03 + actual claim</tspan><tspan x="58" dy="29.900000000000002">Current declaration;</tspan><tspan x="58" dy="29.900000000000002">no hidden gaps</tspan></text><path d="M480,180 L630,180" fill="none" stroke="#2e7185" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="115" width="480" height="135" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="668" y="149" fill="#173042" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="668" dy="0">2  Actual saved, reviewed PDF</tspan><tspan x="668" dy="29.900000000000002">TW2026_S08_GROUP_</tspan><tspan x="668" dy="29.900000000000002">Surname_Firstname.pdf</tspan></text><path d="M890,250 L890,330" fill="none" stroke="#2e7185" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="345" width="480" height="170" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="668" y="379" fill="#173042" font-family="Arial,sans-serif" font-size="22" font-weight="400"><tspan x="668" dy="0">3  Separate institutional action</tspan><tspan x="668" dy="28.6">Upload → save if required → submit</tspan><tspan x="668" dy="28.6">Observe filename + timestamp + status</tspan><tspan x="668" dy="28.6">STOP if Draft / Not submitted</tspan></text><rect x="40" y="345" width="450" height="170" rx="14" fill="#fff0e9" stroke="#ad5530" stroke-width="2"/><text x="58" y="379" fill="#173042" font-family="Arial,sans-serif" font-size="22" font-weight="400"><tspan x="58" dy="0">Boundary</tspan><tspan x="58" dy="28.6">The PDF preflight comes first.</tspan><tspan x="58" dy="28.6">Future receipt stays outside it.</tspan><tspan x="58" dy="28.6">Local file ≠ submission ≠ acceptance</tspan></text><text x="40" y="575" fill="#173042" font-family="Arial,sans-serif" font-size="23" font-weight="700"><tspan x="40" dy="0">One PDF • One S08 Assignment • No second C08 assignment • P02 optional</tspan></text><text x="40" y="647" fill="#496374" font-family="Arial,sans-serif" font-size="17" font-weight="400"><tspan x="40" dy="0">Legend: blue = owned route or data; orange = limit / counterexample; arrows = action or responsibility.</tspan></text></svg>