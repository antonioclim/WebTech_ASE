<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">State ownership, props and callbacks</title><desc id="desc">Illustrative interface diagram: ReadingQueue owns complete items and filter; QueueForm owns its controlled title input; props flow to QueueForm, QueueFilter, QueueList and QueueItem while callbacks carry intent to the owner. Counts and visible items are derived.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e7185"/></marker></defs><rect width="1200" height="670" fill="#f8fbfd"/><text x="40" y="43" fill="#173042" font-family="Arial,sans-serif" font-size="29" font-weight="700"><tspan x="40" dy="0">State ownership, props and callbacks</tspan></text><text x="40" y="76" fill="#496374" font-family="Arial,sans-serif" font-size="17" font-weight="400"><tspan x="40" dy="0">ILLUSTRATIVE INTERFACE DIAGRAM • NOT A SCREENSHOT</tspan></text><rect x="290" y="100" width="590" height="160" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="308" y="134" fill="#173042" font-family="Arial,sans-serif" font-size="22" font-weight="400"><tspan x="308" dy="0">ReadingQueue: authoritative owner</tspan><tspan x="308" dy="28.6">Complete items • active filter</tspan><tspan x="308" dy="28.6">QueueForm owns title</tspan><tspan x="308" dy="28.6">Derived: visible items and</tspan><tspan x="308" dy="28.6">all/read/remaining counts</tspan></text><path d="M370,260 L160,300" fill="none" stroke="#2e7185" stroke-width="3" marker-end="url(#arrow)"/><path d="M510,260 L450,300" fill="none" stroke="#2e7185" stroke-width="3" marker-end="url(#arrow)"/><path d="M660,260 L730,300" fill="none" stroke="#2e7185" stroke-width="3" marker-end="url(#arrow)"/><path d="M800,260 L1020,300" fill="none" stroke="#2e7185" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="310" width="230" height="115" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="58" y="344" fill="#173042" font-family="Arial,sans-serif" font-size="21" font-weight="400"><tspan x="58" dy="0">QueueForm</tspan><tspan x="58" dy="27.3">title + submit</tspan><tspan x="58" dy="27.3">intent</tspan></text><rect x="315" y="310" width="235" height="115" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="333" y="344" fill="#173042" font-family="Arial,sans-serif" font-size="21" font-weight="400"><tspan x="333" dy="0">QueueFilter</tspan><tspan x="333" dy="27.3">filter + change</tspan><tspan x="333" dy="27.3">intent</tspan></text><rect x="590" y="310" width="235" height="115" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="608" y="344" fill="#173042" font-family="Arial,sans-serif" font-size="21" font-weight="400"><tspan x="608" dy="0">QueueList</tspan><tspan x="608" dy="27.3">visible items</tspan></text><rect x="865" y="310" width="265" height="115" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="883" y="344" fill="#173042" font-family="Arial,sans-serif" font-size="21" font-weight="400"><tspan x="883" dy="0">QueueItem</tspan><tspan x="883" dy="27.3">item + ID callbacks</tspan></text><text x="70" y="470" fill="#173042" font-family="Arial,sans-serif" font-size="25" font-weight="700"><tspan x="70" dy="0">Props carry data down; callbacks carry intent up.</tspan></text><text x="70" y="525" fill="#173042" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="70" dy="0">Add event: trim → reject blank → allocate injected ID → pure item transition.</tspan><tspan x="70" dy="29.900000000000002">Render-derived values do not need mirrored state or a synchronising effect.</tspan></text><text x="40" y="647" fill="#496374" font-family="Arial,sans-serif" font-size="17" font-weight="400"><tspan x="40" dy="0">Legend: blue = owned route or data; orange = limit / counterexample; arrows = action or responsibility.</tspan></text></svg>