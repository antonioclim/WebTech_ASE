<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">Three guards, one non-cooperative fake</title><desc id="desc">Illustrative interface diagram: A keeps all guards, B removes numeric comparisons while active permission remains, C keeps abort only with publication guards removed. A and B can reject old settlement; C may publish it when the fake ignores abort.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e7185"/></marker></defs><rect width="1200" height="670" fill="#f8fbfd"/><text x="40" y="43" fill="#173042" font-family="Arial,sans-serif" font-size="29" font-weight="700"><tspan x="40" dy="0">Three guards, one non-cooperative fake</tspan></text><text x="40" y="76" fill="#496374" font-family="Arial,sans-serif" font-size="17" font-weight="400"><tspan x="40" dy="0">ILLUSTRATIVE INTERFACE DIAGRAM • NOT A SCREENSHOT</tspan></text><rect x="40" y="120" width="1080" height="110" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="58" y="154" fill="#173042" font-family="Arial,sans-serif" font-size="24" font-weight="400"><tspan x="58" dy="0">Shared planned trace: start A → dispose A → start B → settle B → late A</tspan><tspan x="58" dy="31.200000000000003">The fake may settle after its abort signal. Name it and its cooperation.</tspan></text><rect x="40" y="285" width="335" height="230" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="58" y="319" fill="#173042" font-family="Arial,sans-serif" font-size="22" font-weight="400"><tspan x="58" dy="0">A  Guards retained</tspan><tspan x="58" dy="28.6">Current active permission</tspan><tspan x="58" dy="28.6">and numeric/latest guards</tspan><tspan x="58" dy="28.6">Expected: old A rejected</tspan><tspan x="58" dy="28.6">Source expectation only</tspan></text><rect x="415" y="285" width="335" height="230" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="433" y="319" fill="#173042" font-family="Arial,sans-serif" font-size="21" font-weight="400"><tspan x="433" dy="0">B  Numeric guards removed</tspan><tspan x="433" dy="27.3">Active/disposed retained</tspan><tspan x="433" dy="27.3">Old A may still be rejected</tspan><tspan x="433" dy="27.3">Do not fabricate a race</tspan><tspan x="433" dy="27.3">Record exact expressions</tspan></text><rect x="790" y="285" width="335" height="230" rx="14" fill="#fff0e9" stroke="#ad5530" stroke-width="2"/><text x="808" y="319" fill="#173042" font-family="Arial,sans-serif" font-size="21" font-weight="400"><tspan x="808" dy="0">C  Abort-only</tspan><tspan x="808" dy="27.3">Publication guards removed</tspan><tspan x="808" dy="27.3">Non-cooperative fake needed</tspan><tspan x="808" dy="27.3">Old A may replace B</tspan><tspan x="808" dy="27.3">Restore valid file afterwards</tspan></text><text x="50" y="575" fill="#173042" font-family="Arial,sans-serif" font-size="24" font-weight="700"><tspan x="50" dy="0">A model or diagram is not an actual React settlement trace.</tspan></text><text x="40" y="647" fill="#496374" font-family="Arial,sans-serif" font-size="17" font-weight="400"><tspan x="40" dy="0">Legend: blue = owned route or data; orange = limit / counterexample; arrows = action or responsibility.</tspan></text></svg>