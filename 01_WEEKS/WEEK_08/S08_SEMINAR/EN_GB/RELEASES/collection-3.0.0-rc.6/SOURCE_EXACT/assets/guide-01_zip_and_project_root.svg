<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">ZIP, extracted package and exact project root</title><desc id="desc">Illustrative interface diagram: the untouched ZIP leads to an extracted folder containing guide.html, form.html and projects; P01 App.jsx lives in projects/p01/student/src. Editing inside the ZIP or the teaching preview is a wrong-root counterexample.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e7185"/></marker></defs><rect width="1200" height="670" fill="#f8fbfd"/><text x="40" y="43" fill="#173042" font-family="Arial,sans-serif" font-size="29" font-weight="700"><tspan x="40" dy="0">ZIP, extracted package and exact project root</tspan></text><text x="40" y="76" fill="#496374" font-family="Arial,sans-serif" font-size="17" font-weight="400"><tspan x="40" dy="0">ILLUSTRATIVE INTERFACE DIAGRAM • NOT A SCREENSHOT</tspan></text><rect x="40" y="120" width="310" height="130" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="58" y="154" fill="#173042" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="58" dy="0">1  Untouched student ZIP</tspan><tspan x="58" dy="29.900000000000002">Preserve original identity</tspan></text><path d="M350,180 L440,180" fill="none" stroke="#2e7185" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="100" width="670" height="170" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="468" y="134" fill="#173042" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="468" dy="0">2  Extracted package root</tspan><tspan x="468" dy="29.900000000000002">guide.html • form.html • projects • teaching</tspan><tspan x="468" dy="29.900000000000002">Ordinary local folder; not a ZIP viewer</tspan></text><path d="M780,270 L780,315" fill="none" stroke="#2e7185" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="325" width="670" height="150" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="468" y="359" fill="#173042" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="468" dy="0">3  Assessed P01 project root</tspan><tspan x="468" dy="29.900000000000002">projects/p01/student</tspan><tspan x="468" dy="29.900000000000002">Only src/App.jsx is the assessed edit target</tspan></text><rect x="40" y="330" width="330" height="180" rx="14" fill="#fff0e9" stroke="#ad5530" stroke-width="2"/><text x="58" y="364" fill="#173042" font-family="Arial,sans-serif" font-size="22" font-weight="400"><tspan x="58" dy="0">Wrong-root counterexample</tspan><tspan x="58" dy="28.6">Inside the ZIP</tspan><tspan x="58" dy="28.6">or teaching/p01-preview</tspan><tspan x="58" dy="28.6">≠ assessed project</tspan></text><text x="40" y="560" fill="#173042" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="40" dy="0">Callout: source identities come before student edits.</tspan><tspan x="40" dy="29.900000000000002">Preview receives only a copy of your saved target; its adapters never go back.</tspan></text><text x="40" y="647" fill="#496374" font-family="Arial,sans-serif" font-size="17" font-weight="400"><tspan x="40" dy="0">Legend: blue = owned route or data; orange = limit / counterexample; arrows = action or responsibility.</tspan></text></svg>