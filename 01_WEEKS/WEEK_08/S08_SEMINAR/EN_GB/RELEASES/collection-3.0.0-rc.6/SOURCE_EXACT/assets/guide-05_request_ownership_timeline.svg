<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">A/B cleanup and publication timeline</title><desc id="desc">Illustrative interface diagram: start A, cleanup and abort A, start B, settle B, then settle A despite abort. Transport abort and permission to publish are different events. B retains current display ownership.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e7185"/></marker></defs><rect width="1200" height="670" fill="#f8fbfd"/><text x="40" y="43" fill="#173042" font-family="Arial,sans-serif" font-size="29" font-weight="700"><tspan x="40" dy="0">A/B cleanup and publication timeline</tspan></text><text x="40" y="76" fill="#496374" font-family="Arial,sans-serif" font-size="17" font-weight="400"><tspan x="40" dy="0">ILLUSTRATIVE INTERFACE DIAGRAM • NOT A SCREENSHOT</tspan></text><text x="50" y="125" fill="#173042" font-family="Arial,sans-serif" font-size="25" font-weight="700"><tspan x="50" dy="0">Planned sequence; a fake deliberately settles despite abort.</tspan></text><path d="M65,240 L1090,240" fill="none" stroke="#2e7185" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="165" width="175" height="145" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="58" y="199" fill="#173042" font-family="Arial,sans-serif" font-size="22" font-weight="400"><tspan x="58" dy="0">1  Start A</tspan><tspan x="58" dy="28.6">A owns</tspan><tspan x="58" dy="28.6">its lifecycle</tspan></text><rect x="265" y="165" width="190" height="145" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="283" y="199" fill="#173042" font-family="Arial,sans-serif" font-size="21" font-weight="400"><tspan x="283" dy="0">2  Cleanup A</tspan><tspan x="283" dy="27.3">Abort signalled</tspan><tspan x="283" dy="27.3">Permission</tspan><tspan x="283" dy="27.3">ends</tspan></text><rect x="505" y="165" width="180" height="145" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="523" y="199" fill="#173042" font-family="Arial,sans-serif" font-size="22" font-weight="400"><tspan x="523" dy="0">3  Start B</tspan><tspan x="523" dy="28.6">B becomes</tspan><tspan x="523" dy="28.6">current owner</tspan></text><rect x="735" y="165" width="180" height="145" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="753" y="199" fill="#173042" font-family="Arial,sans-serif" font-size="22" font-weight="400"><tspan x="753" dy="0">4  Settle B</tspan><tspan x="753" dy="28.6">Publish B</tspan><tspan x="753" dy="28.6">if current</tspan></text><rect x="965" y="165" width="190" height="145" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="983" y="199" fill="#173042" font-family="Arial,sans-serif" font-size="21" font-weight="400"><tspan x="983" dy="0">5  Settle A</tspan><tspan x="983" dy="27.3">Fake ignores</tspan><tspan x="983" dy="27.3">abort signal</tspan></text><rect x="60" y="380" width="1030" height="140" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="78" y="414" fill="#173042" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="78" dy="0">Abort is a transport request; publication permission is an owned lifecycle check.</tspan><tspan x="78" dy="29.900000000000002">Expected guarded display: B remains after late A.</tspan><tspan x="78" dy="29.900000000000002">Record exact guards, fake, command/source class and observed settlement order.</tspan></text><text x="65" y="565" fill="#173042" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="65" dy="0">Short query and unmount dispose ownership too; their consequences need witnesses.</tspan></text><text x="40" y="647" fill="#496374" font-family="Arial,sans-serif" font-size="17" font-weight="400"><tspan x="40" dy="0">Legend: blue = owned route or data; orange = limit / counterexample; arrows = action or responsibility.</tspan></text></svg>