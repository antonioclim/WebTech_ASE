<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">Render, effect and the filter-only witness</title><desc id="desc">Illustrative interface diagram: complete items feed rendering and a persistence effect; a filter change affects derived visible items, not complete items. Mount writes are recorded before comparing post-mount filter-only write counts.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e7185"/></marker></defs><rect width="1200" height="670" fill="#f8fbfd"/><text x="40" y="43" fill="#173042" font-family="Arial,sans-serif" font-size="29" font-weight="700"><tspan x="40" dy="0">Render, effect and the filter-only witness</tspan></text><text x="40" y="76" fill="#496374" font-family="Arial,sans-serif" font-size="17" font-weight="400"><tspan x="40" dy="0">ILLUSTRATIVE INTERFACE DIAGRAM • NOT A SCREENSHOT</tspan></text><rect x="40" y="110" width="340" height="135" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="58" y="144" fill="#173042" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="58" dy="0">Authoritative</tspan><tspan x="58" dy="29.900000000000002">complete items</tspan><tspan x="58" dy="29.900000000000002">HTTP/a/unread</tspan><tspan x="58" dy="29.900000000000002">SQLite/b/read</tspan></text><path d="M380,165 L465,165" fill="none" stroke="#2e7185" stroke-width="3" marker-end="url(#arrow)"/><rect x="480" y="105" width="630" height="140" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="498" y="139" fill="#173042" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="498" dy="0">Render derives visible items/counts</tspan><tspan x="498" dy="29.900000000000002">All / Remaining / Read</tspan><tspan x="498" dy="29.900000000000002">A filter-only action changes this view</tspan></text><path d="M200,245 L200,320" fill="none" stroke="#2e7185" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="335" width="340" height="145" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="58" y="369" fill="#173042" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="58" dy="0">Owned persistence effect</tspan><tspan x="58" dy="29.900000000000002">Depends on complete</tspan><tspan x="58" dy="29.900000000000002">items</tspan><tspan x="58" dy="29.900000000000002">Writes complete array</tspan></text><path d="M380,400 L470,400" fill="none" stroke="#2e7185" stroke-width="3" marker-end="url(#arrow)"/><rect x="480" y="335" width="630" height="145" rx="14" fill="#e6f2f5" stroke="#2e7185" stroke-width="2"/><text x="498" y="369" fill="#173042" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="498" dy="0">Logical reading-queue → teaching namespace</tspan><tspan x="498" dy="29.900000000000002">Record mount/StrictMode writes first</tspan><tspan x="498" dy="29.900000000000002">Then read before → filter → read after</tspan></text><text x="45" y="545" fill="#173042" font-family="Arial,sans-serif" font-size="24" font-weight="700"><tspan x="45" dy="0">Prediction: after this named mount, filter-only adds zero writes.</tspan><tspan x="45" dy="31.200000000000003">Falsifier: extra filter-only write or a stored filtered subset.</tspan></text><text x="40" y="647" fill="#496374" font-family="Arial,sans-serif" font-size="17" font-weight="400"><tspan x="40" dy="0">Legend: blue = owned route or data; orange = limit / counterexample; arrows = action or responsibility.</tspan></text></svg>