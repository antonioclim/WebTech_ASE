<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">One folder, two terminals</title><desc id="desc">Illustrative interface diagram - editor layout and labels may vary</desc><rect width="100%" height="100%" rx="14" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#152738} .head{font-size:24px;font-weight:bold}.sub{font-size:14px}.line{font-size:17px}.num{font-size:16px;font-weight:bold;fill:white}.note{font-size:15px}</style><text x="28" y="39" class="head">V02  One folder, two terminals</text><text x="28" y="64" class="sub">Illustrative interface diagram - editor layout and labels may vary</text><rect x="28" y="91" width="278" height="213" rx="10" fill="#e7f3f0" stroke="#cbd5e1"/><circle cx="50" cy="114" r="13" fill="#17636b"/><text x="50" y="120" text-anchor="middle" class="num">1</text><text x="72" y="120" class="line">Package root</text><text x="45" y="146" class="line">Explorer: 02_PROJECTS</text><text x="45" y="172" class="line">p02 / src / note-query.js</text><text x="45" y="198" class="line">Only this source target</text><text x="45" y="224" class="line">is assessed for P02.</text><rect x="338" y="91" width="285" height="213" rx="10" fill="#eef2ff" stroke="#cbd5e1"/><circle cx="360" cy="114" r="13" fill="#17636b"/><text x="360" y="120" text-anchor="middle" class="num">2</text><text x="382" y="120" class="line">Terminal 1: SERVER</text><text x="355" y="146" class="line">.\START.cmd p02</text><text x="355" y="172" class="line">READY origin:</text><text x="355" y="198" class="line">http://127.0.0.1:PORT</text><text x="355" y="224" class="line">Keep this terminal open.</text><text x="355" y="250" class="line">Ctrl+C stops your server.</text><rect x="654" y="91" width="277" height="213" rx="10" fill="#fff7ed" stroke="#cbd5e1"/><circle cx="676" cy="114" r="13" fill="#17636b"/><text x="676" y="120" text-anchor="middle" class="num">3</text><text x="698" y="120" class="line">Terminal 2: CLIENT</text><text x="671" y="146" class="line">Terminal &gt; New Terminal</text><text x="671" y="172" class="line">Paste a quoted request</text><text x="671" y="198" class="line">Press Enter once.</text><text x="671" y="224" class="line">Record its actual output.</text><text x="28" y="356" class="note">1 Verify the folder.  2 Keep READY in its server terminal.  3 Send requests from another terminal.</text><text x="28" y="379" class="note">The two terminals share the package folder. A new terminal is not a new server.</text></svg>