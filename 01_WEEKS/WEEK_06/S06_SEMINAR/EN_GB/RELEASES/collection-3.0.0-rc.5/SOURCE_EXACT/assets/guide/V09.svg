<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Audit one Gemini claim</title><desc id="desc">Illustrative interface diagram - no live Gemini response was collected here</desc><rect width="100%" height="100%" rx="14" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#152738} .head{font-size:24px;font-weight:bold}.sub{font-size:14px}.line{font-size:17px}.num{font-size:16px;font-weight:bold;fill:white}.note{font-size:15px}</style><text x="28" y="39" class="head">V09  Audit one Gemini claim</text><text x="28" y="64" class="sub">Illustrative interface diagram - no live Gemini response was collected here</text><rect x="28" y="91" width="278" height="192" rx="10" fill="#e7f3f0" stroke="#cbd5e1"/><circle cx="50" cy="114" r="13" fill="#17636b"/><text x="50" y="120" text-anchor="middle" class="num">1</text><text x="72" y="120" class="line">Sanitised prompt</text><text x="45" y="146" class="line">Small public rule</text><text x="45" y="172" class="line">Prior prediction</text><text x="45" y="198" class="line">One relevant excerpt</text><text x="45" y="224" class="line">Actual result or PENDING</text><rect x="338" y="91" width="285" height="192" rx="10" fill="#eef2ff" stroke="#cbd5e1"/><circle cx="360" cy="114" r="13" fill="#17636b"/><text x="360" y="120" text-anchor="middle" class="num">2</text><text x="382" y="120" class="line">One selected claim</text><text x="355" y="146" class="line">Observed / Inferred / Unknown</text><text x="355" y="172" class="line">Independent minimal check</text><text x="355" y="198" class="line">Actual command + result</text><text x="355" y="224" class="line">Do not invent the witness.</text><rect x="654" y="91" width="277" height="192" rx="10" fill="#fff7ed" stroke="#cbd5e1"/><circle cx="676" cy="114" r="13" fill="#17636b"/><text x="676" y="120" text-anchor="middle" class="num">3</text><text x="698" y="120" class="line">Your verdict</text><text x="671" y="146" class="line">Accepted / Rejected</text><text x="671" y="172" class="line">Partly accepted / Unknown</text><text x="671" y="198" class="line">Correction + limitation</text><text x="671" y="224" class="line">Save selected text only.</text><text x="28" y="356" class="note">1 Send one bounded prompt.  2 Inspect or run the independent check.  3 State the supported verdict.</text><text x="28" y="379" class="note">Synthetic practice is labelled practice. It is not an actual service interaction.</text></svg>