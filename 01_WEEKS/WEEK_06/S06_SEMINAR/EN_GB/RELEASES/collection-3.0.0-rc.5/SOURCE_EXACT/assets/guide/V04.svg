<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">The four-row fixture and sorts</title><desc id="desc">Source-expected values only - not measured in this production phase</desc><rect width="100%" height="100%" rx="14" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#152738} .head{font-size:24px;font-weight:bold}.sub{font-size:14px}.line{font-size:17px}.num{font-size:16px;font-weight:bold;fill:white}.note{font-size:15px}</style><text x="28" y="39" class="head">V04  The four-row fixture and sorts</text><text x="28" y="64" class="sub">Source-expected values only - not measured in this production phase</text><rect x="28" y="91" width="444" height="174" rx="10" fill="#e7f3f0" stroke="#cbd5e1"/><circle cx="50" cy="114" r="13" fill="#17636b"/><text x="50" y="120" text-anchor="middle" class="num">1</text><text x="72" y="120" class="line">Fixture IDs and titles</text><text x="45" y="146" class="line">1  Alpha plan / Ada / false</text><text x="45" y="172" class="line">2  100% Ready / Grace / false</text><text x="45" y="198" class="line">3  Archived ALPHA / Ada / true</text><text x="45" y="224" class="line">4  Beta notes / Linus / false</text><rect x="503" y="91" width="428" height="174" rx="10" fill="#eef2ff" stroke="#cbd5e1"/><circle cx="525" cy="114" r="13" fill="#17636b"/><text x="525" y="120" text-anchor="middle" class="num">2</text><text x="547" y="120" class="line">Expected deterministic sequences</text><text x="520" y="146" class="line">updated_desc   4, 1, 2, 3</text><text x="520" y="172" class="line">updated_asc     3, 1, 2, 4</text><text x="520" y="198" class="line">title_asc       2, 1, 3, 4</text><text x="520" y="224" class="line">Every mode ends with id ASC.</text><text x="28" y="356" class="note">1 IDs 1 and 2 share updatedAt.  2 Ascending id settles their tie in both updatedAt modes.</text><text x="28" y="379" class="note">A small run can look stable without a tie-breaker. Inspect the actual order option too.</text></svg>