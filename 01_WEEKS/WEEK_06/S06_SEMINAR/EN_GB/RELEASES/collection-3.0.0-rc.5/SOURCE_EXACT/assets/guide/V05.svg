<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Literal percent and a boolean string</title><desc id="desc">Mechanism diagram - HTTP text must be translated deliberately</desc><rect width="100%" height="100%" rx="14" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#152738} .head{font-size:24px;font-weight:bold}.sub{font-size:14px}.line{font-size:17px}.num{font-size:16px;font-weight:bold;fill:white}.note{font-size:15px}</style><text x="28" y="39" class="head">V05  Literal percent and a boolean string</text><text x="28" y="64" class="sub">Mechanism diagram - HTTP text must be translated deliberately</text><rect x="28" y="91" width="443" height="191" rx="10" fill="#fff7ed" stroke="#cbd5e1"/><circle cx="50" cy="114" r="13" fill="#17636b"/><text x="50" y="120" text-anchor="middle" class="num">1</text><text x="72" y="120" class="line">Percent request</text><text x="45" y="146" class="line">URL token: search=%25</text><text x="45" y="172" class="line">Decoded search text: %</text><text x="45" y="198" class="line">Literal title substring</text><text x="45" y="224" class="line">Not a wildcard pattern</text><rect x="503" y="91" width="428" height="191" rx="10" fill="#e7f3f0" stroke="#cbd5e1"/><circle cx="525" cy="114" r="13" fill="#17636b"/><text x="525" y="120" text-anchor="middle" class="num">2</text><text x="547" y="120" class="line">Archived request</text><text x="520" y="146" class="line">URL token: archived=false</text><text x="520" y="172" class="line">Decoded token is a string</text><text x="520" y="198" class="line">Accepted spellings: true / false</text><text x="520" y="224" class="line">Translate to the exact boolean.</text><text x="28" y="356" class="note">1 URL encoding turns %25 into %.  2 The string &quot;false&quot; is truthy in JavaScript.</text><text x="28" y="379" class="note">Generic truthiness and SQL wildcard assumptions do not implement this query contract.</text></svg>