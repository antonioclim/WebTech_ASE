<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">The query boundary</title><desc id="desc">Mechanism diagram - validation and evidence are separate boundaries</desc><rect width="100%" height="100%" rx="14" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#152738} .head{font-size:24px;font-weight:bold}.sub{font-size:14px}.line{font-size:17px}.num{font-size:16px;font-weight:bold;fill:white}.note{font-size:15px}</style><text x="28" y="39" class="head">V03  The query boundary</text><text x="28" y="64" class="sub">Mechanism diagram - validation and evidence are separate boundaries</text><rect x="28" y="91" width="280" height="104" rx="10" fill="#fff7ed" stroke="#cbd5e1"/><circle cx="50" cy="114" r="13" fill="#17636b"/><text x="50" y="120" text-anchor="middle" class="num">1</text><text x="72" y="120" class="line">Request strings</text><text x="45" y="146" class="line">owner, archived, search</text><text x="45" y="172" class="line">sort, fields</text><rect x="340" y="91" width="285" height="104" rx="10" fill="#e7f3f0" stroke="#cbd5e1"/><circle cx="362" cy="114" r="13" fill="#17636b"/><text x="362" y="120" text-anchor="middle" class="num">2</text><text x="384" y="120" class="line">Validate query tokens</text><text x="357" y="146" class="line">Reject invalid input</text><text x="357" y="172" class="line">before model querying.</text><rect x="656" y="91" width="275" height="104" rx="10" fill="#eef2ff" stroke="#cbd5e1"/><circle cx="678" cy="114" r="13" fill="#17636b"/><text x="678" y="120" text-anchor="middle" class="num">3</text><text x="700" y="120" class="line">Sequelize options</text><text x="673" y="146" class="line">where / order / attributes</text><text x="673" y="172" class="line">Fresh object, no raw SQL</text><rect x="28" y="215" width="280" height="103" rx="10" fill="#eef2ff" stroke="#cbd5e1"/><circle cx="50" cy="238" r="13" fill="#17636b"/><text x="50" y="244" text-anchor="middle" class="num">4</text><text x="72" y="244" class="line">Model call</text><text x="45" y="270" class="line">Note.findAll(options)</text><text x="45" y="296" class="line">Counter witnesses calls.</text><rect x="340" y="215" width="285" height="103" rx="10" fill="#e7f3f0" stroke="#cbd5e1"/><circle cx="362" cy="238" r="13" fill="#17636b"/><text x="362" y="244" text-anchor="middle" class="num">5</text><text x="384" y="244" class="line">Returned rows</text><text x="357" y="270" class="line">Actual ORM + SQLite result</text><text x="357" y="296" class="line">Check IDs and field sets.</text><rect x="656" y="215" width="275" height="103" rx="10" fill="#fff7ed" stroke="#cbd5e1"/><circle cx="678" cy="238" r="13" fill="#17636b"/><text x="678" y="244" text-anchor="middle" class="num">6</text><text x="700" y="244" class="line">HTTP representation</text><text x="673" y="270" class="line">Status + { data } envelope</text><text x="673" y="296" class="line">400 alone gives no count.</text><text x="28" y="356" class="note">Read numbered panels 1 to 6. Invalid input exits at validation; successful input reaches the model.</text><text x="28" y="379" class="note">An options object is not a row set. An HTTP 400 is not a zero-call measurement.</text></svg>