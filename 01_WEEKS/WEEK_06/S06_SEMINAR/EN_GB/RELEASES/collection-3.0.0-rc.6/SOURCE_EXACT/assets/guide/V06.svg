<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Memory and the short file observation</title><desc id="desc">Mechanism diagram - normal connection close is not process restart</desc><rect width="100%" height="100%" rx="14" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#152738} .head{font-size:24px;font-weight:bold}.sub{font-size:14px}.line{font-size:17px}.num{font-size:16px;font-weight:bold;fill:white}.note{font-size:15px}</style><text x="28" y="39" class="head">V06  Memory and the short file observation</text><text x="28" y="64" class="sub">Mechanism diagram - normal connection close is not process restart</text><rect x="28" y="91" width="278" height="202" rx="10" fill="#fff7ed" stroke="#cbd5e1"/><circle cx="50" cy="114" r="13" fill="#17636b"/><text x="50" y="120" text-anchor="middle" class="num">1</text><text x="72" y="120" class="line">P02 API</text><text x="45" y="146" class="line">:memory: database</text><text x="45" y="172" class="line">Deterministic reset seed</text><text x="45" y="198" class="line">Not a persistence proof</text><text x="45" y="224" class="line">across process restarts</text><rect x="338" y="91" width="285" height="202" rx="10" fill="#e7f3f0" stroke="#cbd5e1"/><circle cx="360" cy="114" r="13" fill="#17636b"/><text x="360" y="120" text-anchor="middle" class="num">2</text><text x="382" y="120" class="line">Owned temporary file</text><text x="355" y="146" class="line">Same Node process</text><text x="355" y="172" class="line">Create marker &gt; close</text><text x="355" y="198" class="line">Reopen &gt; inspect marker</text><text x="355" y="224" class="line">Explicit schema reset</text><rect x="654" y="91" width="277" height="202" rx="10" fill="#eef2ff" stroke="#cbd5e1"/><circle cx="676" cy="114" r="13" fill="#17636b"/><text x="676" y="120" text-anchor="middle" class="num">3</text><text x="698" y="120" class="line">Record the boundary</text><text x="671" y="146" class="line">Owned path + process ID</text><text x="671" y="172" class="line">Stage observations</text><text x="671" y="198" class="line">Marker after reset</text><text x="671" y="224" class="line">Cleanup state or UNKNOWN</text><text x="28" y="356" class="note">1 API memory is a different store.  2 The helper owns its temporary file.  3 Keep missing stages visible.</text><text x="28" y="379" class="note">This observation does not test power loss, crashes or a Node process restart.</text></svg>