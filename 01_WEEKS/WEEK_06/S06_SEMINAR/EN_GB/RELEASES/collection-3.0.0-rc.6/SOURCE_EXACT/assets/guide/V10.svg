<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Check Moodle submission status</title><desc id="desc">Illustrative interface diagram - names and layout vary by site configuration</desc><rect width="100%" height="100%" rx="14" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#152738} .head{font-size:24px;font-weight:bold}.sub{font-size:14px}.line{font-size:17px}.num{font-size:16px;font-weight:bold;fill:white}.note{font-size:15px}</style><text x="28" y="39" class="head">V10  Check Moodle submission status</text><text x="28" y="64" class="sub">Illustrative interface diagram - names and layout vary by site configuration</text><rect x="28" y="91" width="278" height="202" rx="10" fill="#e7f3f0" stroke="#cbd5e1"/><circle cx="50" cy="114" r="13" fill="#17636b"/><text x="50" y="120" text-anchor="middle" class="num">1</text><text x="72" y="120" class="line">Correct assignment</text><text x="45" y="146" class="line">S06 - Query API</text><text x="45" y="172" class="line">Individual evidence</text><text x="45" y="198" class="line">Add submission / file picker</text><text x="45" y="224" class="line">Upload one checked PDF</text><rect x="338" y="91" width="285" height="202" rx="10" fill="#eef2ff" stroke="#cbd5e1"/><circle cx="360" cy="114" r="13" fill="#17636b"/><text x="360" y="120" text-anchor="middle" class="num">2</text><text x="382" y="120" class="line">Save then submit</text><text x="355" y="146" class="line">Wait for upload</text><text x="355" y="172" class="line">Save changes</text><text x="355" y="198" class="line">Submit assignment if shown</text><text x="355" y="224" class="line">Confirm statement if shown</text><rect x="654" y="91" width="277" height="202" rx="10" fill="#fff7ed" stroke="#cbd5e1"/><circle cx="676" cy="114" r="13" fill="#17636b"/><text x="676" y="120" text-anchor="middle" class="num">3</text><text x="698" y="120" class="line">Verify the receipt</text><text x="671" y="146" class="line">Correct PDF filename</text><text x="671" y="172" class="line">Submitted for grading</text><text x="671" y="198" class="line">Displayed timestamp</text><text x="671" y="224" class="line">Draft is not final.</text><text x="28" y="356" class="note">1 Verify the title before upload.  2 Complete the final submit stage.  3 Read the actual receipt.</text><text x="28" y="379" class="note">The lecturer announces the deadline separately. No deadline is invented in this kit.</text></svg>