<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Draft export, final PDF and inspection</title><desc id="desc">Illustrative interface diagram - structure validation does not authenticate evidence</desc><rect width="100%" height="100%" rx="14" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#152738} .head{font-size:24px;font-weight:bold}.sub{font-size:14px}.line{font-size:17px}.num{font-size:16px;font-weight:bold;fill:white}.note{font-size:15px}</style><text x="28" y="39" class="head">V08  Draft export, final PDF and inspection</text><text x="28" y="64" class="sub">Illustrative interface diagram - structure validation does not authenticate evidence</text><rect x="28" y="91" width="278" height="192" rx="10" fill="#e7f3f0" stroke="#cbd5e1"/><circle cx="50" cy="114" r="13" fill="#17636b"/><text x="50" y="120" text-anchor="middle" class="num">1</text><text x="72" y="120" class="line">Evidence form</text><text x="45" y="146" class="line">Prediction stays original</text><text x="45" y="172" class="line">Actual input/result/class</text><text x="45" y="198" class="line">Missing work = PENDING</text><text x="45" y="224" class="line">Declaration last</text><rect x="338" y="91" width="285" height="192" rx="10" fill="#eef2ff" stroke="#cbd5e1"/><circle cx="360" cy="114" r="13" fill="#17636b"/><text x="360" y="120" text-anchor="middle" class="num">2</text><text x="382" y="120" class="line">JSON draft</text><text x="355" y="146" class="line">Export &gt; check saved file</text><text x="355" y="172" class="line">Import explicitly if needed</text><text x="355" y="198" class="line">Declaration resets</text><text x="355" y="224" class="line">JSON is not the submission.</text><rect x="654" y="91" width="277" height="192" rx="10" fill="#fff7ed" stroke="#cbd5e1"/><circle cx="676" cy="114" r="13" fill="#17636b"/><text x="676" y="120" text-anchor="middle" class="num">3</text><text x="698" y="120" class="line">Single final PDF</text><text x="671" y="146" class="line">Inspect every page</text><text x="671" y="172" class="line">Full answers readable</text><text x="671" y="198" class="line">Correct filename</text><text x="671" y="224" class="line">Save before Moodle upload</text><text x="28" y="356" class="note">1 Fill actual observations.  2 Preserve a recoverable draft.  3 Reopen the final PDF before upload.</text><text x="28" y="379" class="note">A completeness message cannot approve an alternative route or verify that an experiment happened.</text></svg>