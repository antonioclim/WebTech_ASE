<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Observe the correct browser tab</title><desc id="desc">Illustrative interface diagram - optional Network evidence, CLI also accepted</desc><rect width="100%" height="100%" rx="14" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#152738} .head{font-size:24px;font-weight:bold}.sub{font-size:14px}.line{font-size:17px}.num{font-size:16px;font-weight:bold;fill:white}.note{font-size:15px}</style><text x="28" y="39" class="head">V07  Observe the correct browser tab</text><text x="28" y="64" class="sub">Illustrative interface diagram - optional Network evidence, CLI also accepted</text><rect x="28" y="91" width="443" height="190" rx="10" fill="#e7f3f0" stroke="#cbd5e1"/><circle cx="50" cy="114" r="13" fill="#17636b"/><text x="50" y="120" text-anchor="middle" class="num">1</text><text x="72" y="120" class="line">Correct tab</text><text x="45" y="146" class="line">Address: READY origin</text><text x="45" y="172" class="line">http://127.0.0.1:PORT</text><text x="45" y="198" class="line">Developer tools &gt; Network</text><text x="45" y="224" class="line">Select /api/notes request</text><rect x="503" y="91" width="428" height="190" rx="10" fill="#fff7ed" stroke="#cbd5e1"/><circle cx="525" cy="114" r="13" fill="#17636b"/><text x="525" y="120" text-anchor="middle" class="num">2</text><text x="547" y="120" class="line">Different evidence</text><text x="520" y="146" class="line">file:// guide tab: no API server</text><text x="520" y="172" class="line">Gemini tab: a different site</text><text x="520" y="198" class="line">Response tab: HTTP JSON</text><text x="520" y="224" class="line">No model-call count here</text><text x="28" y="356" class="note">1 Use the server origin printed by READY.  2 Keep external or file:// tabs separate.</text><text x="28" y="379" class="note">Chrome / Edge / Firefox routes are illustrative; request status and response are 