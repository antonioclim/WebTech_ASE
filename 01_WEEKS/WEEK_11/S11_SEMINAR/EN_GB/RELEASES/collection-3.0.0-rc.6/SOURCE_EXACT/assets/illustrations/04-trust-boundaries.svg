<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" role="img" aria-labelledby="title desc"><title id="title">Locate trusted moderation facts</title><desc id="desc">Authentication, route and repository own different facts. 1  Authentication supplies the principal. 2  Route supplies a constant action. 3  Repository supplies owner and report state. 4  Body is proposed input, never authority. A conceptual provenance diagram, not authentication acceptance.</desc><rect width="1080" height="610" fill="#f8fafc"/><rect x="1" y="1" width="1078" height="608" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="42" y="56" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Locate trusted moderation facts</text><text x="42" y="94" font-family="Arial,sans-serif" font-size="23" fill="#334155">Authentication, route and repository own different facts</text><rect x="42" y="160" width="304" height="112" rx="12" fill="#e0f2fe" stroke="#475569" stroke-width="2"/><text x="194" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Trusted principal</text><rect x="388" y="160" width="304" height="112" rx="12" fill="#ecfdf5" stroke="#475569" stroke-width="2"/><text x="540" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Constant action</text><rect x="734" y="160" width="304" height="112" rx="12" fill="#fef3c7" stroke="#475569" stroke-width="2"/><text x="886" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Stored resource</text><path d="M194,280 V303 H540 V315" stroke="#475569" stroke-width="2" fill="none"/><path d="M540,280 V303 H540 V315" stroke="#475569" stroke-width="2" fill="none"/><path d="M886,280 V303 H540 V315" stroke="#475569" stroke-width="2" fill="none"/><text x="540" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Policy decision uses all three</text><circle cx="58" cy="366" r="15" fill="#0f172a"/><text x="58" y="373" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">1</text><text x="86" y="373" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">Authentication supplies the principal</text><circle cx="58" cy="409" r="15" fill="#0f172a"/><text x="58" y="416" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">2</text><text x="86" y="416" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">Route supplies a constant action</text><circle cx="58" cy="452" r="15" fill="#0f172a"/><text x="58" y="459" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">3</text><text x="86" y="459" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">Repository supplies owner and report state</text><circle cx="58" cy="495" r="15" fill="#0f172a"/><text x="58" y="502" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">4</text><text x="86" y="502" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">Body is proposed input, never authority</text><text x="42" y="576" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#334155">Illustrative interface diagram — not an actual screenshot</text></svg>