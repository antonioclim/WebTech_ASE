<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" role="img" aria-labelledby="title desc"><title id="title">Name the owner of each outcome</title><desc id="desc">A public status alone does not identify the mechanism. 1  401 — missing authentication boundary. 2  403 — ordinary permission refusal. 3  404 — missing or configured concealment. 4  409 — supplied route state precondition. Outcome categories are instructional, not measured HTTP responses.</desc><rect width="1080" height="610" fill="#f8fafc"/><rect x="1" y="1" width="1078" height="608" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="42" y="56" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Name the owner of each outcome</text><text x="42" y="94" font-family="Arial,sans-serif" font-size="23" fill="#334155">A public status alone does not identify the mechanism</text><rect x="42" y="160" width="304" height="112" rx="12" fill="#e0f2fe" stroke="#475569" stroke-width="2"/><text x="194" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Identity boundary</text><rect x="388" y="160" width="304" height="112" rx="12" fill="#ecfdf5" stroke="#475569" stroke-width="2"/><text x="540" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Permission</text><text x="540" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">decision</text><rect x="734" y="160" width="304" height="112" rx="12" fill="#fef3c7" stroke="#475569" stroke-width="2"/><text x="886" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">State precondition</text><text x="540" y="311" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">A status does not identify the entire path</text><circle cx="58" cy="366" r="15" fill="#0f172a"/><text x="58" y="373" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">1</text><text x="86" y="373" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">401 — missing authentication boundary</text><circle cx="58" cy="409" r="15" fill="#0f172a"/><text x="58" y="416" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">2</text><text x="86" y="416" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">403 — ordinary permission refusal</text><circle cx="58" cy="452" r="15" fill="#0f172a"/><text x="58" y="459" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">3</text><text x="86" y="459" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">404 — missing or configured concealment</text><circle cx="58" cy="495" r="15" fill="#0f172a"/><text x="58" y="502" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">4</text><text x="86" y="502" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">409 — supplied route state precondition</text><text x="42" y="576" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#334155">Illustrative interface diagram — not an actual screenshot</text></svg>