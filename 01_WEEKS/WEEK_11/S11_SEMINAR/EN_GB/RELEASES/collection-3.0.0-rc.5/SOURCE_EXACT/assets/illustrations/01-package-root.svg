<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" role="img" aria-labelledby="title desc"><title id="title">Find the extracted root</title><desc id="desc">ZIP view and extracted folder are different. 1  ZIP archive — preserve it. 2  Extract into a new short folder. 3  Open S11_STUDENT_v1.2.1. 4  Look for the guide, projects and tools. Package location and extraction; not an actual Windows screenshot.</desc><rect width="1080" height="610" fill="#f8fafc"/><rect x="1" y="1" width="1078" height="608" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="42" y="56" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Find the extracted root</text><text x="42" y="94" font-family="Arial,sans-serif" font-size="23" fill="#334155">ZIP view and extracted folder are different</text><rect x="42" y="160" width="304" height="112" rx="12" fill="#e0f2fe" stroke="#475569" stroke-width="2"/><text x="194" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Archive</text><rect x="388" y="160" width="304" height="112" rx="12" fill="#ecfdf5" stroke="#475569" stroke-width="2"/><text x="540" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Extracted root</text><rect x="734" y="160" width="304" height="112" rx="12" fill="#fef3c7" stroke="#475569" stroke-width="2"/><text x="886" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Beginner guide</text><path d="M352,216 h28 l-9,-7 m9,7 l-9,7" stroke="#334155" stroke-width="3" fill="none"/><path d="M698,216 h28 l-9,-7 m9,7 l-9,7" stroke="#334155" stroke-width="3" fill="none"/><circle cx="58" cy="366" r="15" fill="#0f172a"/><text x="58" y="373" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">1</text><text x="86" y="373" font-family="Arial,sans-serif" font-