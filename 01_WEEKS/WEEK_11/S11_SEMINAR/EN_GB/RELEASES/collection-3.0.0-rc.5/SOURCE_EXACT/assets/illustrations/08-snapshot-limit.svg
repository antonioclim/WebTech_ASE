<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" role="img" aria-labelledby="title desc"><title id="title">Keep the snapshot claim bounded</title><desc id="desc">A frozen flat clone does not create a transaction. 1  The selected resource has a flat snapshot. 2  Record the property actually checked. 3  Nested graphs need separate reasoning. 4  Locks and concurrent updates remain untested. This is an explanatory comparison, not a database or race experiment.</desc><rect width="1080" height="610" fill="#f8fafc"/><rect x="1" y="1" width="1078" height="608" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="42" y="56" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Keep the snapshot claim bounded</text><text x="42" y="94" font-family="Arial,sans-serif" font-size="23" fill="#334155">A frozen flat clone does not create a transaction</text><rect x="42" y="160" width="304" height="112" rx="12" fill="#e0f2fe" stroke="#475569" stroke-width="2"/><text x="194" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Flat snapshot</text><rect x="388" y="160" width="304" height="112" rx="12" fill="#ecfdf5" stroke="#475569" stroke-width="2"/><text x="540" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Freeze check</text><rect x="734" y="160" width="304" height="112" rx="12" fill="#fef3c7" stroke="#475569" stroke-width="2"/><text x="886" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Concurrency</text><text x="886" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">unknown</text><text x="540" y="311" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">Separate claims need separate witnesses</text><circle cx="58" cy="366" r="15" fill="#0f172a"/><text x="58" y="373" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">1</text><text x="86" y="373" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">The selected resource has a flat snapshot</text><circle cx="58" cy="409" r="15" fill="#0f172a"/><text x="58" y="416" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">2</text><text x="86" y="416" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">Record the property actually checked</text><circle cx="58" cy="452" r="15" fill="#0f172a"/><text x="58" y="459" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">3</text><text x="86" y="459" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">Nested graphs need separate reasoning</text><circle cx="58" cy="495" r="15" fill="#0f172a"/><text x="58" y="502" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">4</text><text x="86" y="502" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">Locks and concurrent updates remain untested</text><text x="42" y="576" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#334155">Illustrative interface diagram — not an actual screenshot</text></svg>