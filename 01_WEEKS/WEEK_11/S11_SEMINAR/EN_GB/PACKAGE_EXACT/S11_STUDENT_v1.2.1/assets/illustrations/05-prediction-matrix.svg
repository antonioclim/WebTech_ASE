<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" role="img" aria-labelledby="title desc"><title id="title">Predict before observing</title><desc id="desc">Keep prediction and measured result in separate columns. 1  Select a normal synthetic case. 2  Predict allow, forbid or conceal. 3  Leave the actual result blank until measured. 4  Retain correction, locator and evidence class. Prediction slots are illustrative and contain no completed assessment matrix.</desc><rect width="1080" height="610" fill="#f8fafc"/><rect x="1" y="1" width="1078" height="608" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="42" y="56" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Predict before observing</text><text x="42" y="94" font-family="Arial,sans-serif" font-size="23" fill="#334155">Keep prediction and measured result in separate columns</text><rect x="42" y="160" width="304" height="112" rx="12" fill="#e0f2fe" stroke="#475569" stroke-width="2"/><text x="194" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Case + source</text><rect x="388" y="160" width="304" height="112" rx="12" fill="#ecfdf5" stroke="#475569" stroke-width="2"/><text x="540" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Own prediction</text><rect x="734" y="160" width="304" height="112" rx="12" fill="#fef3c7" stroke="#475569" stroke-width="2"/><text x="886" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Result pending</text><text x="540" y="311" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">Do not fill the result from the prediction</text><circle cx="58" cy="366" r="15" fill="#0f172a"/><text x="58" y="373" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">1</text><text x="86" y="373" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">Select a normal synthetic case</text><circle cx="58" cy="409" r="15" fill="#0f172a"/><text x="58" y="416" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">2</text><text x="86" y="416" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">Predict allow, forbid or conceal</text><circle cx="58" cy="452" r="15" fill="#0f172a"/><text x="58" y="459" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">3</text><text x="86" y="459" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">Leave the actual result blank until measured</text><circle cx="58" cy="495" r="15" fill="#0f172a"/><text x="58" y="502" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">4</text><text x="86" y="502" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">Retain correction, locator and evidence class</text><text x="42" y="576" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#334155">Illustrative interface diagram — not an actual screenshot</text></svg>