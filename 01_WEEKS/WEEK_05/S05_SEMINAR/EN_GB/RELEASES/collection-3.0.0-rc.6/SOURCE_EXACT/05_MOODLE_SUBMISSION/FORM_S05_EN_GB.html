<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta content="width=device-width,initial-scale=1" name="viewport"><title>S05 evidence form</title><style>body{font:16px/1.45 system-ui,sans-serif;max-width:1000px;margin:auto;padding:1rem;color:#172554}label{display:block;font-weight:700;margin:.8rem 0}textarea,input{display:block;width:100%;min-height:3.2rem;margin-top:.25rem;padding:.5rem}.controls{position:sticky;top:0;background:white;padding:.6rem;border-bottom:2px solid #94a3b8}button{padding:.55rem .8rem;margin:.2rem}.warning{background:#fff7ed;border-left:6px solid #c2410c;padding:.8rem}@media print{.controls,.warning{display:none}textarea{border:0;min-height:2.3rem}}:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}input[readonly]{background:#eef2ff;min-height:2.4rem}@media(prefers-contrast:more){textarea,input,button{border:2px solid #000}}</style></head><body><div class="controls"><button id="save" type="button">Save locally</button><button id="print" type="button">Print / Save as PDF</button><button id="reset" type="button">Reset</button><strong aria-live="polite" id="status"></strong></div><form id="evidenceForm"><h1>S05 — Individual evidence form</h1><p class="warning">Do not include passwords, tokens, cookies, private conversations, real personal data or the project folder.</p><label>Recommended PDF filename<input aria-live="polite" id="filename" readonly value="TW2026_S05_GROUP_Surname_Firstname.pdf"></label><label>Kit version<input id="kitVersion" readonly value="1.2.0"></label><label>Seminar ID<input id="seminarId" readonly value="S05"></label><label>Surname<input autocomplete="family-name" id="surname" required="True"></label><label>First name<input autocomplete="given-name" id="firstName" required="True"></label><label>Group<textarea id="group" required=""></textarea></label><label>Date<textarea id="date" required=""></textarea></label><label>PACKAGE_ID<textarea id="packageId" required=""></textarea></label><label>Operating system<textarea id="os" required=""></textarea></label><label>Node.js version<textarea id="node" required=""></textarea></label><label>npm version<textarea id="npm" required=""></textarea></label><label>Express<textarea id="express" required=""></textarea></label><label>Postman<textarea id="postman" required=""></textarea></label><label>Prediction<textarea id="prediction" required=""></textarea></label><label>Action<textarea id="action" required=""></textarea></label><label>Expected<textarea id="expected" required=""></textarea></label><label>Observed<textarea id="observed" required=""></textarea></label><label>Difference<textarea id="difference" required=""></textarea></label><label>Evidence class<textarea id="evidenceClass" required=""></textarea></label><label>Evidence<textarea id="evidence" required=""></textarea></label><label>Mechanism<textarea id="mechanism" required=""></textarea></label><label>Reproduction<textarea id="reproduction" required=""></textarea></label><label>Gemini prompt<textarea id="geminiPrompt" required=""></textarea></label><label>Gemini claim<textarea id="geminiClaim" required=""></textarea></label><label>Verification<textarea id="verification" required=""></textarea></label><label>Verdict<textarea id="verdict" required=""></textarea></label><label>Correction<textarea id="correction" required=""></textarea></label><label>Limitation<textarea id="limitation" required=""></textarea></label><label>Reflection<textarea id="reflection" required=""></textarea></label><label>Next smallest check<textarea id="nextCheck" required=""></textarea></label><label>Privacy<textarea id="privacy" required="" placeholder="NOT CONFIRMED — write your own declaration only after reviewing the evidence and saved PDF."></textarea></label><label>Declaration<textarea id="declaration" required="" placeholder="NOT CONFIRMED — write your own declaration only after reviewing the evidence and saved PDF."></textarea></label><script>
const statusEl=document.getElementById('status');
const form=document.getElementById('evidenceForm');
const key='tw2026-s05-form-v1.2';
const ids=['surname','firstName','group','date','packageId','os','node','npm','express','postman','prediction','action','expected','observed','difference','evidenceClass','evidence','mechanism','reproduction','geminiPrompt','geminiClaim','verification','verdict','correction','limitation','reflection','nextCheck','privacy','declaration'];
const clean=value=>(value||'').trim().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9_-]+/g,'_').replace(/^_+|_+$/g,'')||'UNKNOWN';
function filename(){
  const group=clean(document.getElementById('group').value||'GROUP');
  const surname=clean(document.getElementById('surname').value||'Surname');
  const first=clean(document.getElementById('firstName').value||'Firstname');
  const value=`TW2026_S05_${group}_${surname}_${first}.pdf`;
  document.getElementById('filename').value=value;
  return value;
}
function collect(){return Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value]))}
function load(){
  try{
    const data=JSON.parse(localStorage.getItem(key)||'{}');
    ids.forEach(id=>{document.getElementById(id).value=data[id]||''});
  }catch{statusEl.textContent='Local storage is unavailable; keep this page open and print before closing.'}
  filename();
}
['surname','firstName','group'].forEach(id=>document.getElementById(id).addEventListener('input',filename));
document.getElementById('save').addEventListener('click',()=>{
  try{localStorage.setItem(key,JSON.stringify(collect()));statusEl.textContent=`Saved locally. Recommended filename: ${filename()}`}
  catch{statusEl.textContent='Local save failed. Keep this page open and print before closing.'}
});
document.getElementById('print').addEventListener('click',()=>{
  filename();
  if(form.reportValidity())window.print();
  else statusEl.textContent='Complete every required field before printing.';
});
document.getElementById('reset').addEventListener('click',()=>{
  if(confirm('Reset local form data?')){
    try{localStorage.removeItem(key)}catch{}
    ids.forEach(id=>{document.getElementById(id).value=''});
    filename();statusEl.textContent='Reset';
  }
});
load();
</script></form><script src="../assets/student-form-focus.js"></script></body></html>
