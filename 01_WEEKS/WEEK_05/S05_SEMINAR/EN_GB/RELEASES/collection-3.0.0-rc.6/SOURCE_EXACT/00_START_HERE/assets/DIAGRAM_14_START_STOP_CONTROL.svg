<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#f8fafc"/><rect x="35" y="30" width="1430" height="840" rx="24" fill="none" stroke="#23395d" stroke-width="5"/><text x="70" y="105" font-size="46" font-weight="700" fill="#172554">Bounded start and stop</text><text x="70" y="155" font-size="26" fill="#334155">A control record must identify the package, token, PID and loopback URL</text><rect x="80" y="230" width="1340" height="78" rx="14" fill="white" stroke="#64748b" stroke-width="2"/><text x="110" y="278" font-size="25" fill="#0f172a">1. Check exact runtime and dependency first</text><rect x="80" y="330" width="1340" height="78" rx="14" fill="white" stroke="#64748b" stroke-width="2"/><text x="110" y="378" font-size="25" fill="#0f172a">2. Start only on 127.0.0.1</text><rect x="80" y="430" width="1340" height="78" rx="14" fill="white" stroke="#64748b" stroke-width="2"/><text x="110" y="478" font-size="25" fill="#0f172a">3. Write token and PACKAGE_ID to the control record</text><rect x="80" y="530" width="1340" height="78" rx="14" fill="white" stroke="#64748b" stroke-width="2"/><text x="110" y="578" font-size="25" fill="#0f172a">4. Confirm the ready endpoint before opening</text><rect x="80" y="630" width="1340" height="78" rx="14" fill="white" stroke="#64748b" stroke-width="2"/><text x="110" y="678" font-size="25" fill="#0f172a">5. STOP removes only the verified process</text><text x="70" y="840" font-size="20" fill="#475569">Illustrative interface diagram</text></svg>