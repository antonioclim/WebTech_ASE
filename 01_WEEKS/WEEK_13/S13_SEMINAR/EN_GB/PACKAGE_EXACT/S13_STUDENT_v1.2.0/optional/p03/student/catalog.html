<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Catalog</title><style>body{font:16px system-ui;padding:1rem}button{display:block;margin:.5rem 0;padding:.5rem}</style></head><body><h1>Catalog</h1><button data-id="item-1">Item one</button><button data-id="item-2">Item two</button><script>const generation=Number(new URL(location.href).searchParams.get("generation"));const shellOrigin="http://127.0.0.1:4212";parent.postMessage({type:"fragment.ready",version:1,generation,payload:{}},shellOrigin);document.addEventListener("click",event=>{const itemId=event.target.dataset.id;if(itemId)parent.postMessage({type:"item.selected",version:1,generation,payload:{itemId}},shellOrigin)});if(generation===1)setTimeout(()=>document.querySelector('[data-id="item-2"]').click(),100);</script></body></html>
