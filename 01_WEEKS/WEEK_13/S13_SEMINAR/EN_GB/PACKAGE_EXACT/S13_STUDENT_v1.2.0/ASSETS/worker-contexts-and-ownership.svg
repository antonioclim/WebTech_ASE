<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Different contexts, explicit ownership</title><desc id="desc">Two execution contexts with main-thread DOM/client on one side and the dedicated Worker calculation on the other, connected by identifier-bearing messages.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#005B96"/></marker></defs>
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F3F6FA" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1600" height="158" rx="0" fill="#13263F" stroke="none" stroke-width="2"/>
<text x="50" y="43" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="start">S13  /  VI02  /  ILLUSTRATIVE INTERFACE DIAGRAM</text>
<text x="50" y="91" font-family="DejaVu Sans" font-size="38" font-weight="bold" fill="#FFFFFF" text-anchor="start">Different contexts, explicit ownership</text>
<text x="50" y="132" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#DCE8F7" text-anchor="start">Dedicated Worker topology • exact admitted message names.</text>
<rect x="50" y="196" width="660" height="549" rx="16" fill="#FFFFFF" stroke="#A6B4C5" stroke-width="2"/>
<rect x="52" y="198" width="656" height="62" rx="14" fill="#E6F1FA" stroke="none" stroke-width="2"/>
<text x="75" y="238" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#13263F" text-anchor="start">DOCUMENT / MAIN THREAD</text>
<circle cx="93" cy="301" r="22" fill="#005B96"/>
<text x="93" y="309" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="129" y="310" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#13263F" text-anchor="start">Page owns DOM updates</text>
<text x="129" y="353" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#13263F" text-anchor="start">Read input, show status and display results.</text>
<text x="129" y="391" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#13263F" text-anchor="start">A Worker cannot directly edit this DOM.</text>
<rect x="84" y="419" width="591" height="270" rx="16" fill="#E6F1FA" stroke="none" stroke-width="2"/>
<circle cx="123" cy="469" r="22" fill="#005B96"/>
<text x="123" y="477" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="159" y="478" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#13263F" text-anchor="start">Client owns request lifecycle</text>
<text x="159" y="521" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#13263F" text-anchor="start">pending: requestId → caller</text>
<text x="159" y="558" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#13263F" text-anchor="start">Register before postMessage().</text>
<text x="159" y="595" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#13263F" text-anchor="start">Settle once, remove terminal entry</text>
<text x="159" y="632" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#13263F" text-anchor="start">and remove its abort listener.</text>
<rect x="965" y="196" width="585" height="549" rx="16" fill="#FFFFFF" stroke="#A6B4C5" stroke-width="2"/>
<rect x="967" y="198" width="581" height="62" rx="14" fill="#E6F1FA" stroke="none" stroke-width="2"/>
<text x="990" y="238" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#13263F" text-anchor="start">DEDICATED WORKER</text>
<circle cx="1008" cy="301" r="22" fill="#006E65"/>
<text x="1008" y="309" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1044" y="310" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#13263F" text-anchor="start">Supplied algorithm</text>
<text x="1044" y="352" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Calculate with the admitted peer.</text>
<text x="1044" y="393" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Send data back with requestId.</text>
<text x="1044" y="434" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Keep DOM work in the document.</text>
<rect x="999" y="511" width="516" height="164" rx="12" fill="#FFF2D6" stroke="none" stroke-width="2"/>
<text x="1021" y="545.0" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">Cancellation is cooperative here:</text>
<text x="1021" y="574.9" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">the supplied algorithm yields</text>
<text x="1021" y="604.8" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">between chunks. A cancel message</text>
<text x="1021" y="634.7" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">does not interrupt uninterrupted</text>
<text x="1021" y="664.6" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">synchronous work.</text>
<line x1="725" y1="399" x2="943" y2="399" stroke="#005B96" stroke-width="4" marker-end="url(#arrow)"/>
<text x="830" y="357" font-family="DejaVu Sans Mono" font-size="20" font-weight="normal" fill="#005B96" text-anchor="middle">analysis.start</text>
<text x="830" y="430" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#40516A" text-anchor="middle">requestId + values</text>
<line x1="945" y1="572" x2="728" y2="572" stroke="#005B96" stroke-width="4" marker-end="url(#arrow)"/>
<text x="831" y="483" font-family="DejaVu Sans Mono" font-size="19" font-weight="normal" fill="#005B96" text-anchor="middle">analysis.progress</text>
<text x="831" y="510" font-family="DejaVu Sans Mono" font-size="19" font-weight="normal" fill="#005B96" text-anchor="middle">analysis.completed</text>
<text x="831" y="537" font-family="DejaVu Sans Mono" font-size="19" font-weight="normal" fill="#005B96" text-anchor="middle">analysis.failed</text>
<text x="830" y="608" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#40516A" text-anchor="middle">same requestId</text>
<rect x="50" y="777" width="1500" height="85" rx="12" fill="#E4F3EF" stroke="none" stroke-width="2"/>
<circle cx="91" cy="816" r="22" fill="#006E65"/>
<text x="91" y="824" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="128" y="809" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">analysis.cancel carries requestId. Terminal cleanup belongs to that request;</text>
<text x="128" y="843" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">the healthy shared Worker remains until failure or dispose.</text>
<line x1="50" y1="891" x2="1550" y2="891" stroke="#A6B4C5" stroke-width="3"/>
<text x="50" y="926" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#13263F" text-anchor="start">Illustrative interface diagram: the page owns the DOM and the client owns each pending request.</text>
<text x="50" y="981" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#40516A" text-anchor="start">Locally authored diagram • No actual interface capture • Record your own browser, version, origin and evidence.</text>
</svg>
