<text x="530" y="456" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="566" y="457" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#13263F" text-anchor="start">Separate current state from this diagram</text>
<text x="566" y="503" font-family="DejaVu Sans Mono" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Origin:  record the actual origin and port</text>
<text x="566" y="548" font-family="DejaVu Sans Mono" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Script:  record the resolved script URL</text>
<text x="566" y="593" font-family="DejaVu Sans Mono" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Scope:   record the registration scope</text>
<text x="566" y="638" font-family="DejaVu Sans Mono" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">State:   record installing / waiting / active</text>
<text x="566" y="683" font-family="DejaVu Sans Mono" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Control: inspect the current-page controller separately</text>
<rect x="50" y="815" width="1500" height="60" rx="12" fill="#FFF2D6" stroke="none" stroke-width="2"/>
<text x="72" y="849.0" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">Offline and Cache Storage are conditional extension tools. The supplied P02 cache is empty; it does not</text>
<text x="72" y="878.9" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">establish offline readiness.</text>
<line x1="50" y1="891" x2="1550" y2="891" stroke="#A6B4C5" stroke-width="3"/>
<text x="50" y="926" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#13263F" text-anchor="start">Illustrative interface diagram: locate the documented Chromium Service Worker inspection area and record the</text>
<text x="50" y="954" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#13263F" text-anchor="start">state you see.</text>
<text x="50" y="981" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#40516A" text-anchor="start">Locally authored diagram • No actual interface capture • Record your own browser, version, origin and evidence.</text>
