<text x="91" y="456" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="127" y="457" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#13263F" text-anchor="start">Application</text>
<rect x="76" y="480" width="351" height="65" rx="10" fill="#E6F1FA" stroke="none" stroke-width="2"/>
<text x="96" y="520" font-family="DejaVu Sans" font-size="23" font-weight="bold" fill="#13263F" text-anchor="start">Service Workers / workers</text>
<text x="78" y="597" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">Chrome: Service Workers</text>
<text x="78" y="637" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">Edge: Service workers</text>
<text x="78" y="677" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">Use the visible equivalent</text>
<text x="78" y="717" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">in your installed version.</text>
<rect x="487" y="342" width="1063" height="443" rx="16" fill="#FFFFFF" stroke="#A6B4C5" stroke-width="2"/>
<rect x="489" y="344" width="1059" height="62" rx="14" fill="#E6F1FA" stroke="none" stroke-width="2"/>
<text x="512" y="384" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#13263F" text-anchor="start">SERVICE WORKER INSPECTION / record what is actually visible</text>
