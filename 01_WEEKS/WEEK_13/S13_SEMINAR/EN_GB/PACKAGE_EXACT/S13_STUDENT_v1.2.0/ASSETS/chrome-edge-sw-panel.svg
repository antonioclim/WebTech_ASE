<text x="126" y="248" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#13263F" text-anchor="start">Record: Chrome or Microsoft Edge, exact version</text>
<circle cx="90" cy="280" r="22" fill="#006E65"/>
<text x="90" y="288" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="126" y="289" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#13263F" text-anchor="start">Address: http://127.0.0.1:&lt;ACTUAL_PORT&gt;/…</text>
