<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">A matching result answers only one question</title><desc id="desc">Two equal analysis summaries beside separate evidence boxes for computation context and interface heartbeat.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#005B96"/></marker></defs>
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F3F6FA" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1600" height="158" rx="0" fill="#13263F" stroke="none" stroke-width="2"/>
<text x="50" y="43" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="start">S13  /  VI04  /  ILLUSTRATIVE INTERFACE DIAGRAM</text>
<text x="50" y="91" font-family="DejaVu Sans" font-size="38" font-weight="bold" fill="#FFFFFF" text-anchor="start">A matching result answers only one question</text>
<text x="50" y="132" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#DCE8F7" text-anchor="start">Conditional comparison • no timings, heartbeat counts or browser passes are invented.</text>
<rect x="50" y="199" width="705" height="282" rx="16" fill="#FFFFFF" stroke="#A6B4C5" stroke-width="2"/>
<rect x="52" y="201" width="701" height="62" rx="14" fill="#E6F1FA" stroke="none" stroke-width="2"/>
<text x="75" y="241" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#13263F" text-anchor="start">MAIN-THREAD ROUTE • compare later</text>
<rect x="785" y="199" width="765" height="282" rx="16" fill="#FFFFFF" stroke="#A6B4C5" stroke-width="2"/>
<rect x="787" y="201" width="761" height="62" rx="14" fill="#E6F1FA" stroke="none" stroke-width="2"/>
<text x="810" y="241" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#13263F" text-anchor="start">WORKER ROUTE • compare later</text>
<circle cx="92" cy="304" r="22" fill="#005B96"/>
<text x="92" y="312" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="128" y="313" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#13263F" text-anchor="start">Same deterministic input</text>
<text x="128" y="354" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Retain the exact values and oracle.</text>
<text x="128" y="394" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">If the output matches, record correctness.</text>
<circle cx="827" cy="304" r="22" fill="#006E65"/>
<text x="827" y="312" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="863" y="313" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#13263F" text-anchor="start">Same expected summary</text>
<text x="863" y="354" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Compare all required result values.</text>
<text x="863" y="394" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Matching output alone proves no offload.</text>
<text x="769" y="449" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#005B96" text-anchor="middle">=</text>
<rect x="50" y="523" width="705" height="271" rx="16" fill="#FFFFFF" stroke="#A6B4C5" stroke-width="2"/>
<rect x="52" y="525" width="701" height="62" rx="14" fill="#E4F3EF" stroke="none" stroke-width="2"/>
<text x="75" y="565" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#13263F" text-anchor="start">SEPARATE QUESTION / context</text>
<circle cx="92" cy="629" r="22" fill="#006E65"/>
<text x="92" y="637" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="128" y="638" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#13263F" text-anchor="start">Where did it execute?</text>
<text x="128" y="679" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Use actual Worker/context evidence.</text>
<text x="128" y="720" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">setTimeout still runs in the page.</text>
<rect x="785" y="523" width="765" height="271" rx="16" fill="#FFFFFF" stroke="#A6B4C5" stroke-width="2"/>
<rect x="787" y="525" width="761" height="62" rx="14" fill="#FFF2D6" stroke="none" stroke-width="2"/>
<text x="810" y="565" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#13263F" text-anchor="start">SEPARATE QUESTION / responsiveness</text>
<circle cx="827" cy="629" r="22" fill="#805300"/>
<text x="827" y="637" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="863" y="638" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#13263F" text-anchor="start">Did the interface remain usable?</text>
<text x="863" y="679" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Define and record the observation interval.</text>
<text x="863" y="720" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Retain actual heartbeat/UI evidence.</text>
<text x="50" y="848" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#40516A" text-anchor="start">A source reading or model fixture cannot be relabelled as either native browser observation.</text>
<line x1="50" y1="891" x2="1550" y2="891" stroke="#A6B4C5" stroke-width="3"/>
<text x="50" y="926" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#13263F" text-anchor="start">Illustrative interface diagram: equal outputs do not establish the execution context or responsiveness.</text>
<text x="50" y="981" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#40516A" text-anchor="start">Locally authored diagram • No actual interface capture • Record your own browser, version, origin and evidence.</text>
</svg>
