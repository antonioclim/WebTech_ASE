<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Firefox: use its own toolbox routes</title><desc id="desc">A Firefox toolbox illustration identifying Application/Service Workers, Network Monitor and Storage as distinct tools.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#005B96"/></marker></defs>
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F3F6FA" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1600" height="158" rx="0" fill="#13263F" stroke="none" stroke-width="2"/>
<text x="50" y="43" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="start">S13  /  VI07  /  ILLUSTRATIVE INTERFACE DIAGRAM</text>
<text x="50" y="91" font-family="DejaVu Sans" font-size="38" font-weight="bold" fill="#FFFFFF" text-anchor="start">Firefox: use its own toolbox routes</text>
<text x="50" y="132" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#DCE8F7" text-anchor="start">Documented route illustration • record the installed version and equivalent labels.</text>
<circle cx="77" cy="217" r="22" fill="#005B96"/>
<text x="77" y="225" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="113" y="226" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#13263F" text-anchor="start">Browser identity: Firefox and the actual installed version</text>
<rect x="50" y="256" width="1500" height="164" rx="16" fill="#FFFFFF" stroke="#A6B4C5" stroke-width="2"/>
<rect x="52" y="258" width="1496" height="62" rx="14" fill="#E6F1FA" stroke="none" stroke-width="2"/>
<text x="75" y="298" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#13263F" text-anchor="start">Application → Service Workers</text>
<circle cx="93" cy="367" r="22" fill="#005B96"/>
<text x="93" y="375" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="133" y="362" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#13263F" text-anchor="start">Inspect the registration and worker state.</text>
<text x="133" y="395" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#13263F" text-anchor="start">Check current-page control separately.</text>
<rect x="50" y="449" width="1500" height="164" rx="16" fill="#FFFFFF" stroke="#A6B4C5" stroke-width="2"/>
<rect x="52" y="451" width="1496" height="62" rx="14" fill="#E4F3EF" stroke="none" stroke-width="2"/>
<text x="75" y="491" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#13263F" text-anchor="start">Network Monitor → Throttling → Offline</text>
<circle cx="93" cy="560" r="22" fill="#006E65"/>
<text x="93" y="568" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="133" y="555" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#13263F" text-anchor="start">Conditional network simulation, not a physical disconnect.</text>
<text x="133" y="588" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#13263F" text-anchor="start">A request outcome is stronger evidence than navigator.onLine.</text>
<rect x="50" y="642" width="1500" height="164" rx="16" fill="#FFFFFF" stroke="#A6B4C5" stroke-width="2"/>
<rect x="52" y="644" width="1496" height="62" rx="14" fill="#FFF2D6" stroke="none" stroke-width="2"/>
<text x="75" y="684" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#13263F" text-anchor="start">Storage → Cache Storage</text>
<circle cx="93" cy="753" r="22" fill="#805300"/>
<text x="93" y="761" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="133" y="748" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#13263F" text-anchor="start">Conditional cache inspection; record actual entries.</text>
<text x="133" y="781" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#13263F" text-anchor="start">An empty cache name is not a cache hit or offline success.</text>
<text x="50" y="858" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#40516A" text-anchor="start">No Chromium-only checkbox is required. Experimental Nightly source-arrow debugging is optional.</text>
<line x1="50" y1="891" x2="1550" y2="891" stroke="#A6B4C5" stroke-width="3"/>
<text x="50" y="926" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#13263F" text-anchor="start">Illustrative interface diagram: Firefox uses its own documented toolbox routes.</text>
<text x="50" y="981" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#40516A" text-anchor="start">Locally authored diagram • No actual interface capture • Record your own browser, version, origin and evidence.</text>
</svg>
