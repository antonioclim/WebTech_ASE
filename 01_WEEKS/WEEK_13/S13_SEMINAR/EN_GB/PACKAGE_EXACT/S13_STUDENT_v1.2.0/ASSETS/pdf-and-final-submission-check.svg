<text x="762" y="246" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#13263F" text-anchor="start">MOODLE / GENERIC LABELS, VERIFY YOUR SITE</text>
<circle cx="779" cy="334" r="22" fill="#005B96"/>
<text x="779" y="342" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="815" y="343" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#13263F" text-anchor="start">Add submission → Save changes</text>
<text x="815" y="390" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#13263F" text-anchor="start">Attach one reviewed PDF.</text>
<text x="815" y="429" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#13263F" text-anchor="start">A saved draft may still need final submission.</text>
<circle cx="779" cy="508" r="22" fill="#006E65"/>
<text x="779" y="516" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="815" y="517" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#13263F" text-anchor="start">Submit assignment, where required</text>
<text x="815" y="565" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#13263F" text-anchor="start">Read the actual final status on your site.</text>
<text x="815" y="608" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#13263F" text-anchor="start">Check the accepted filename and receipt.</text>
<text x="815" y="651" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#13263F" text-anchor="start">Record the outcome; do not infer it from PDF export.</text>
<rect x="772" y="710" width="742" height="118" rx="12" fill="#FFF2D6" stroke="none" stroke-width="2"/>
<text x="794" y="744.0" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">CODE is a filename placeholder: replace it with a</text>
<text x="794" y="773.9" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">sanitised student code or institution-approved</text>
<text x="794" y="803.8" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">alias.</text>
<line x1="50" y1="891" x2="1550" y2="891" stroke="#A6B4C5" stroke-width="3"/>
<text x="50" y="926" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#13263F" text-anchor="start">Illustrative interface diagram: inspect the complete PDF and verify the site’s actual final submission status.</text>
<text x="50" y="981" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#40516A" text-anchor="start">Locally authored diagram • No actual interface capture • Record your own browser, version, origin and evidence.</text>
