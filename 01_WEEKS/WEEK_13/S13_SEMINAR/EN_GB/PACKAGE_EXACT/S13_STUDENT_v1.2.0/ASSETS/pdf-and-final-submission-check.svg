<text x="124" y="703" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#13263F" text-anchor="start">visible and complete?</text>
<circle cx="466" cy="353" r="22" fill="#005B96"/>
<text x="466" y="361" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="502" y="362" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#13263F" text-anchor="start">Inspect</text>
<text x="463" y="401" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">every page</text>
<text x="463" y="440" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">and long-field</text>
<text x="463" y="479" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">last lines.</text>
