<text x="90" y="667" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="124" y="667" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#13263F" text-anchor="start">NATIVE SW</text>
<text x="491" y="667" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#13263F" text-anchor="start">Actual origin, states and trace</text>
<text x="1081" y="652" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">NOT_EXECUTED in this</text>
<text x="1081" y="683" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">local production scope.</text>
<line x1="52" y1="719" x2="1548" y2="719" stroke="#A6B4C5" stroke-width="1"/>
<rect x="50" y="755" width="1500" height="112" rx="12" fill="#FFF2D6" stroke="none" stroke-width="2"/>
<text x="72" y="789.0" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">When a route is unavailable, retain its actual reason, the missing observation and the next</text>
<text x="72" y="821.5" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">authorised action. A reasoned pending record remains a draft, not an automatic completed experiment.</text>
<line x1="50" y1="891" x2="1550" y2="891" stroke="#A6B4C5" stroke-width="3"/>
<text x="50" y="926" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#13263F" text-anchor="start">Illustrative interface diagram: record a blocked native route without converting a model into a browser result.</text>
<text x="50" y="981" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#40516A" text-anchor="start">Locally authored diagram • No actual interface capture • Record your own browser, version, origin and evidence.</text>
</svg>
