<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Registration, readiness and control</title><desc id="desc">Registration and readiness boxes followed by an independent current-controller check with controlled and uncontrolled branches.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#005B96"/></marker></defs>
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F3F6FA" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1600" height="158" rx="0" fill="#13263F" stroke="none" stroke-width="2"/>
<text x="50" y="43" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="start">S13  /  VI05  /  ILLUSTRATIVE INTERFACE DIAGRAM</text>
<text x="50" y="91" font-family="DejaVu Sans" font-size="38" font-weight="bold" fill="#FFFFFF" text-anchor="start">Registration, readiness and control</text>
<text x="50" y="132" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#DCE8F7" text-anchor="start">Required P02 trace • observe each state on the actual eligible served origin.</text>
<rect x="50" y="199" width="720" height="246" rx="16" fill="#FFFFFF" stroke="#A6B4C5" stroke-width="2"/>
<rect x="52" y="201" width="716" height="62" rx="14" fill="#E6F1FA" stroke="none" stroke-width="2"/>
<text x="75" y="241" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#13263F" text-anchor="start">REGISTRATION / one observation</text>
<circle cx="92" cy="305" r="22" fill="#005B96"/>
<text x="92" y="313" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="128" y="314" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#13263F" text-anchor="start">register() result</text>
<text x="128" y="354" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Record script URL, scope and state.</text>
<text x="128" y="394" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">A registration is not current-page control.</text>
<rect x="800" y="199" width="750" height="246" rx="16" fill="#FFFFFF" stroke="#A6B4C5" stroke-width="2"/>
<rect x="802" y="201" width="746" height="62" rx="14" fill="#E4F3EF" stroke="none" stroke-width="2"/>
<text x="825" y="241" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#13263F" text-anchor="start">ACTIVE / READY / another observation</text>
<circle cx="842" cy="305" r="22" fill="#006E65"/>
<text x="842" y="313" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="878" y="314" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#13263F" text-anchor="start">ready can wait indefinitely</text>
<text x="878" y="354" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Bound the application observation.</text>
<text x="878" y="394" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">An active worker can exist without control.</text>
<circle cx="77" cy="503" r="22" fill="#005B96"/>
<text x="77" y="511" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="113" y="512" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#13263F" text-anchor="start">Check navigator.serviceWorker.controller separately</text>
<rect x="50" y="542" width="720" height="237" rx="16" fill="#FFFFFF" stroke="#A6B4C5" stroke-width="2"/>
<rect x="52" y="544" width="716" height="62" rx="14" fill="#E4F3EF" stroke="none" stroke-width="2"/>
<text x="75" y="584" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#13263F" text-anchor="start">CURRENT CONTROLLER PRESENT</text>
<text x="80" y="649" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Use the scoped versioned task GET trace.</text>
<text x="80" y="693" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Check current source, version and request ID.</text>
<rect x="800" y="542" width="750" height="237" rx="16" fill="#FFFFFF" stroke="#A6B4C5" stroke-width="2"/>
<rect x="802" y="544" width="746" height="62" rx="14" fill="#FFF2D6" stroke="none" stroke-width="2"/>
<text x="825" y="584" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#13263F" text-anchor="start">CURRENT CONTROLLER ABSENT</text>
<text x="830" y="649" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Record a direct-fetch fallback or blocked route.</text>
<text x="830" y="693" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#13263F" text-anchor="start">Do not label ready as controlling this page.</text>
<rect x="50" y="806" width="1500" height="74" rx="12" fill="#E6F1FA" stroke="none" stroke-width="2"/>
<circle cx="91" cy="843" r="22" fill="#005B96"/>
<text x="91" y="851" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="128" y="834" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">clients.claim() may adopt an already-open page. Record actual transitions;</text>
<text x="128" y="865" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#13263F" text-anchor="start">do not force a fixed first-load/reload story.</text>
<line x1="50" y1="891" x2="1550" y2="891" stroke="#A6B4C5" stroke-width="3"/>
<text x="50" y="926" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#13263F" text-anchor="start">Illustrative interface diagram: registration, readiness and control of this page are separate observations.</text>
<text x="50" y="981" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#40516A" text-anchor="start">Locally authored diagram • No actual interface capture • Record your own browser, version, origin and evidence.</text>
</svg>
