<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Details</title><style>body{font:16px system-ui;padding:1rem}</style></head><body><h1>Details</h1><p id="content">Choose an item</p><script>const generation=Number(new URL(location.href).searchParams.get("generation"));const shellOrigin="http://127.0.0.1:4212";parent.postMessage({type:"fragment.ready",version:1,generation,payload:{}},shellOrigin);addEventListener("message",event=>{const m=event.data;if(event.origin!==shellOrigin||event.source!==parent||m?.type!=="details.show"||m.version!==1||m.generation!==generation)return;document.querySelector("#content").textContent=`${m.payload.item.title}: ${m.payload.item.description}`;parent.postMessage({type:"details.rendered",version:1,generation,payload:{itemId:m.payload.item.id}},shellOrigin)});</script></body></html>
