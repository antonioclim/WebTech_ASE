<!--
  Teaching guide

  Goal: `postMessage` crosses an execution boundary by structured cloning. The main thread and worker do not share the posted object.

  Why this design: The complete browser example is only one request and one response, making the ownership boundary visible before correlation, cancellation, and progress complicate the protocol.

  Follow the evidence:
  - The worker receives `[2, 4, 6]` and computes `12`.
  - The main thread immediately changes its own first value to `99`.
  - The page reports both results and sets `data-result="pass"`; the mutation did not alter the worker's clone.
-->
