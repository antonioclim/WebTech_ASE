<!doctype html><html lang="en"><meta charset="utf-8"><title>Widget</title><body><p id="value">Waiting</p><script>const params=new URLSearchParams(location.search);const generation=Number(params.get("generation"));setTimeout(()=>parent.postMessage({type:"ready",generation},location.origin),Number(params.get("delay")));addEventListener("message",event=>{if(event.origin!==location.origin||event.data?.type!=="render"||event.data.generation!==generation)return;document.querySelector("#value").textContent=event.data.theme;parent.postMessage({type:"rendered",generation,theme:event.data.theme},location.origin);});</script></body></html>
